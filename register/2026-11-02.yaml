# RegWatch register, week ending 2026-11-02
# Converted from the weekly brief. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.

window:
  start: 2026-10-27
  end: 2026-11-02
  coverage: partial
  note: >-
    Eight records: five US, two UK, one EU. One record sits outside the sweep window
    by publication date and is included because its deadline is the one most worth
    having on the calendar: 2026-11-02-uk-002, FCA CP26/38, published 2026-10-23 and
    read in full this run. The FATF delisting record 2026-11-02-us-005 cites FinCEN's
    release as its source_url because the obligation it records is FinCEN's, and
    because every fatf-gafi.org page returned a client error during the 2 November
    run. The FATF statements were read on 2026-11-07, when the site loaded: the
    Jurisdictions under Increased Monitoring statement of 30 October 2026 lists
    Bulgaria, Cote d'Ivoire, the Democratic Republic of the Congo and Monaco as no
    longer subject to increased monitoring, and the call for action statement of the
    same date names the DPRK, Iran and Myanmar, so FinCEN's account is confirmed. The
    plenary outcomes document was not read, so no FATF standards change, report or
    guidance from the October 2026 plenary is recorded. The AMLA record
    2026-11-02-eu-001 was added when this file was committed on 2026-11-07, so that
    the 13 November date reaches the calendar; its source was read on 2026-11-02. The two OFAC actions of
    27 and 28 October are kept as separate records because the instrument types differ
    (enforcement against a US exporter, sanctions_action against a designation
    network) and the required actions do not overlap. Sources that could not be read
    this run, so their absence is not silence: FATF (all pages, site-side client
    error), Council of the EU press releases (listing returned only items up to
    2026-09-24), Europol newsroom (provenance block and JavaScript-rendered articles),
    Federal Register API (provenance block), DOJ press release listing
    (robots-disallowed), Bank of England news (provenance block), EBA search endpoint
    (robots-disallowed; the press release listing was read by another route and shows
    nothing since 2026-10-22). Two linked documents named on pages that were read were
    not themselves read and nothing from them is asserted: FinCEN's notice on the use
    of charities and non-profit organisations for illicit activity (30 October), and
    the OFAC enforcement release and settlement agreement for Extreme Networks.

items:
  - id: 2026-11-02-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: advisory
    title: >-
      Alert on foreign-agent-directed transactions sets red flags for principal money
      services businesses and their banks, with SAR key term FIN2026FOREIGNAGENT
    reference: FIN-2026-Alert009
    published: 2026-10-30
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/system/files/2026-10/FinCEN-Alert-Foreign-Agent-Directed-Transactions.pdf
    verified: 2026-11-02

    entity_scope: [money_service_businesses, credit_institutions, payment_service_providers]
    functions_affected: [financial_crime, compliance, operations, onboarding]

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      FinCEN asks institutions to watch for suspicious activity in cross-border
      payments where a US-based money services business transfers funds at the
      direction of a foreign agent, warning that settlement arrangements with weak due
      diligence or monitoring can conceal ultimate beneficiaries and purpose. Two
      distinct red flag sets are given, one for principal MSBs and one for banks
      serving MSBs, with named jurisdictions of concern for third-party payments
      (China, the UAE, Egypt, and East African countries including Kenya, Uganda and
      Djibouti). The second-order consequence is that the exposed stream is the one
      monitoring was deliberately tuned to suppress: agent settlement is large, round,
      regular and between known counterparties, so it is classified as expected
      activity by design. Two of the red flags are not monitoring rules at all.
      Testing for a payee not covered by the agent clearing agreement requires someone
      to read the agreement, placing a contract review inside a detection control, and
      the request that principals evidence their agents' due diligence on payees is
      third-party diligence on a third party's third party, for which most firms hold
      an attestation rather than a mechanism. Scored actionability 3 rather than 4
      because it is a supervisory expectation carrying no rule change and no dated
      obligation, but it sits at the top of that band: the SAR key term means the
      filing population is retrievable as a set, so the absence of filings becomes a
      visible fact. Reach 4 as a defined licence category and their banking providers
      rather than a whole sector.

    required_action: >-
      Identify the population of foreign-agent-directed payments. Test them against
      the agent clearing agreements rather than against a monitoring threshold.
      Establish how the firm would evidence an agent's due diligence on its payees.
      Confirm that SAR field 2 and the narrative can carry FIN2026FOREIGNAGENT, and
      that Form 8300 filings can carry it in Comments with box 1b selected. Banks
      serving MSBs should separately review whether their MSB monitoring treats
      settlement payments as expected activity.

    status: open
    supersedes: null

  - id: 2026-11-02-us-002
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: sanctions_action
    title: >-
      Ten individuals and one entity designated for DPRK IT worker fraud against US
      businesses, two listings carrying digital currency addresses
    reference: Executive Orders 13687 and 13722
    published: 2026-10-28
    effective: 2026-10-28
    deadline: null
    deadline_type: null
    source_url: https://home.treasury.gov/news/press-releases/sb0669
    verified: 2026-11-02

    entity_scope: [all_regulated_firms, crypto_asset_service_providers]
    functions_affected: [financial_crime, compliance, technology, operations, board]

    scores:
      actionability: 4
      reach: 5

    rationale: >-
      OFAC designated four handlers and intermediaries, six Russia-based DPRK IT
      workers and the First Financial and Technical Development Center, a
      DPRK-controlled body in Russia that deploys IT workers. Treasury describes
      workers using fraudulent documents, stolen identities and fabricated personas to
      be hired by legitimate US and allied firms, the regime taking most of the wages,
      proceeds moved using cryptocurrency, money laundering techniques and AI tools,
      and network access used in some cases to deploy malware and steal data. The
      action builds on a 12 March 2026 designation of a separate network. The
      second-order consequence is that the control which would prevent this does not
      live in the sanctions function: the entry point is a hiring decision taken on a
      document, a video call and a reference, and by the time a screen could match a
      name the firm has already granted credentials. Identity assurance at onboarding
      for staff and contractors is therefore now a sanctions control, owned at most
      organisations by HR or procurement and assured by nobody. Two listings carry
      digital currency addresses, so a screening tool unable to ingest an address field
      will return a clean result it is not entitled to return. Actionability 4 because
      the asset-freeze and reporting obligations are immediate and binding but the
      substantive remediation, identity assurance in recruitment, is a programme rather
      than a switch. Reach 5 as the exposed population is every employer of remote
      technical contractors, which is cross-sector and not confined to regulated firms.
      The same release carried unrelated Democratic Republic of the Congo designations
      including the Ministry of Defence of the Republic of Rwanda and Zigama Credit and
      Savings Society, Kigali; the designation of a savings and credit institution is a
      straightforward screening and exit question for any bank with counterparty
      exposure to it.

    required_action: >-
      Screen against the new listings including the digital currency addresses, and
      confirm the screening tool ingests address fields. Report blocked property to
      OFAC. Separately, establish who assures that a remote contractor is the person on
      the identity document, what that assurance consists of, and whether it has ever
      been tested; raise the answer at the risk committee rather than inside the
      sanctions function. Banks should check corporate-client monitoring for
      payroll-adjacent payments to jurisdictions inconsistent with a contractor's
      claimed location. Check counterparty exposure to Zigama Credit and Savings
      Society.

    status: open
    supersedes: null

  - id: 2026-11-02-us-003
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: enforcement
    title: >-
      Extreme Networks settles for $1,529,685 over nine exports to a Russian defence
      manufacturer blocked by majority ownership, voluntarily self-disclosed and
      determined egregious
    reference: Settlement Agreement with Extreme Networks, Inc.
    published: 2026-10-27
    effective: 2026-10-27
    deadline: null
    deadline_type: null
    source_url: https://ofac.treasury.gov/recent-actions/20261027
    verified: 2026-11-02

    entity_scope: [all_regulated_firms]
    functions_affected: [compliance, financial_crime, legal, operations, data]

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      OFAC settled with Extreme Networks, Inc., a North Carolina headquartered cloud
      networking provider, for $1,529,685 over networking equipment and related
      services exported on nine occasions between September 2018 and March 2022 to JSC
      Moskovskiy Mashinostroitelniy Zavod Avangard, a Russian defence manufacturer
      majority owned by designated JSC Concern Almaz Antey and therefore blocked by
      operation of law. OFAC determined the apparent violations voluntarily
      self-disclosed and egregious. Two facts carry the lesson. The counterparty was
      not itself designated, so a control that checks a name against a list and stops
      would never have caught it: ownership resolution is a research function requiring
      someone to establish who owns a customer and keep that answer current, because
      ownership changes without the customer saying so. Nine shipments across three and
      a half years is an absent control rather than a lapse, consistent with a customer
      onboarded once, screened clean once and never re-examined. The second fact is
      that voluntary self-disclosure coexisted with an egregiousness determination and
      a seven-figure settlement, which means the decision to self-disclose has to be
      made on its merits rather than on an expectation of leniency. Scored actionability
      3 under the enforcement guidance added to rubric.md on 2026-10-16: the action
      establishes a supervisory expectation that firms outside the matter should now be
      able to evidence a position on, namely that counterparty screening resolves
      ownership and refreshes it, because the ownership rule applies to everyone subject
      to US jurisdiction. Consistent with the OFAC enforcement record at
      2026-10-12-us-004, also scored 3. Reach 4 because the exposed population, non-financial
      exporters of technology and their reseller channels, is a defined sector rather
      than a sub-population, and those firms frequently have no ownership-resolution or
      counterparty-refresh function at all.

    required_action: >-
      Establish whether counterparty screening resolves ownership or only matches
      names, and whether ownership data is refreshed after onboarding rather than
      captured once. For firms outside financial services, confirm whether any function
      owns ownership resolution at all. Separately, decide the firm's position on
      voluntary self-disclosure before an incident requires one, on the basis that
      disclosure mitigates but does not avert an egregiousness finding.

    status: open
    supersedes: null

  - id: 2026-11-02-us-004
    jurisdiction: US
    regulator: Federal Trade Commission
    regulator_short: FTC
    instrument_type: report
    title: >-
      Section 6(b) orders to nine companies demand the inputs, tools and procedures
      behind individualised pricing and worker compensation, responses due 45 days from
      receipt
    reference: FTC Act Section 6(b)
    published: 2026-10-28
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ftc.gov/news-events/news/press-releases/2026/10/ftc-launches-personalized-pricing-compensation-inquiry
    verified: 2026-11-02

    entity_scope: [all_regulated_firms]
    functions_affected: [compliance, legal, data, technology, risk, board]

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      The Commission voted 2 to 0 to issue Section 6(b) orders to Delta, United,
      JetBlue, Lyft, Uber, DoorDash, Instacart, Target and Walmart, asking whether
      prices for tickets, rides, deliveries or other products vary from person to
      person, including through loyalty programme participation or algorithmic analysis
      of personal data, and whether ride-sharing and food-delivery worker pay offers
      shift on data such as phone usage or past offer acceptance. Each recipient must
      document the inputs, tools and procedures used to set or adjust prices and
      compensation. The second-order consequence is that the demand is a documentation
      test rather than a conduct test: inputs, lineage and change control for a system
      most firms treat as commercial intellectual property rather than a governed
      process. The compensation half is the more novel exposure, because varying a
      worker's pay offer on behavioural data is an algorithmic employment decision and
      employment decisions sit in functions with no model inventory, validation or
      challenge process. A 6(b) study is also how the FTC builds the factual record
      that can support later rulemaking or enforcement, so the planning assumption
      should move whether or not a firm received a letter. Scored actionability 2: no
      obligation attaches to anyone outside the nine recipients and no rule is proposed,
      so this is direction of travel. Reach 5 as cross-sector, covering any business
      that varies price or pay by individual using a model. Deadline recorded as null
      deliberately: the orders carry a 45-day clock from receipt and receipt dates are
      not published, so no calendar date exists to record and none is invented.

    required_action: >-
      Treat this as a readiness question rather than a notice. Establish whether the
      firm could produce, inside 45 days, an inventory of its pricing or compensation
      models, their inputs, the tools used and the change history, with a named owner
      able to describe the methodology. Extend model governance to algorithmic
      employment and compensation decisions, which commonly sit outside it. Firms with
      European operations should check whether the AI Act and model-governance files
      already being assembled would answer this.

    status: open
    supersedes: null

  - id: 2026-11-02-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      High Court undertakings in a Tomlin order dated 27 October bind HTX not to
      promote cryptoasset services unlawfully to UK consumers, directly or indirectly
    reference: Tomlin order dated 2026-10-27; section 21 Financial Services and Markets Act 2000
    published: 2026-10-29
    effective: 2026-10-27
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/fca-stops-htxs-crypto-promotions
    verified: 2026-11-02

    entity_scope: [crypto_asset_service_providers]
    functions_affected: [compliance, legal, operations]

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      The FCA and Huobi Global S.A. settled proceedings commenced in the Business and
      Property Division of the High Court on 21 October 2025 and announced publicly on
      10 February 2026, recorded in a Tomlin order dated 27 October 2026. The
      undertakings cover communicating, directly or indirectly, a financial promotion
      contravening section 21 FSMA, across the HTX website, software applications and
      social media. HTX is no longer active in the UK: no deposits, no new UK sign-ups,
      and no targeting or soliciting of UK consumers. Settlement terms are confidential
      and carry no admission of liability. No penalty is stated. The second-order
      consequence is the instrument rather than the outcome: a court-backed undertaking
      with contempt consequences reaches a firm with no UK authorisation to withdraw and
      no UK entity to fine, which makes it a reusable template against offshore
      operators, cheaper and faster than enforcement. The explicit inclusion of indirect
      communication puts affiliates, introducers, influencers and app distribution
      inside the perimeter, so a firm that has outsourced its UK reach to a marketing
      network has not outsourced the section 21 question. For UK consumers holding
      assets on a platform that exits, the consequence is an orderly withdrawal problem
      with no compensation scheme behind it, and no deadline for withdrawing residual
      assets is published. Scored actionability 2 under the enforcement guidance in
      rubric.md: the lesson is real but confined to a narrow population, cryptoasset
      promotion chains reaching UK consumers; reach 3 as a sub-population defined by business
      model, offshore platforms with UK user bases and their promotion chains. Note the
      page metadata carries a 26 October timestamp while the page itself states first
      published 29 October 2026; the later date is recorded. Continues the cryptoasset
      thread at 2026-10-06-uk-001.

    required_action: >-
      Firms in any UK promotion chain for cryptoasset services should map indirect
      communication routes, including affiliates, introducers and app distribution, and
      confirm who holds the section 21 analysis for each. Offshore platforms with UK
      users should decide now whether they intend to be inside the UK cryptoasset
      gateway, since the alternative is the exit path this order records.

    status: open
    supersedes: null

  - id: 2026-11-02-uk-002
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: consultation_paper
    title: >-
      Consultation closes 24 December 2026 on Financial Crime Guide updates across
      seven areas including fraud, cryptoassets, sanctions and proliferation financing
    reference: CP26/38
    published: 2026-10-23
    effective: null
    deadline: 2026-12-24
    deadline_type: consultation_close
    source_url: https://www.fca.org.uk/publications/consultation-papers/cp26-38-financial-crime-guide-updates
    verified: 2026-11-02

    entity_scope: [all_regulated_firms, crypto_asset_service_providers, credit_institutions, payment_service_providers]
    functions_affected: [financial_crime, compliance, risk, data, board]

    scores:
      actionability: 3
      reach: 5

    rationale: >-
      The FCA proposes updating its Financial Crime Guide across seven areas: fraud,
      cryptoassets (reflecting the new regime from October 2027), financial and trade
      sanctions, proliferation financing, data security, financial crime systems and
      controls, and money laundering and terrorist financing. The stated aim is to keep
      the guide current with emerging risks including those linked to AI, cryptoassets
      and evolving sanctions regimes. Scope is all firms the FCA supervises for
      financial crime, including under the Money Laundering Regulations 2017, with
      Annex 1 financial institutions and cryptoasset businesses named as examples.
      Published three days before this edition's sweep window opened and recorded here
      because the deadline is the one most worth having on the calendar: the Financial
      Crime Guide is the document FCA supervisors examine against, so a change to it
      changes the standard against which a firm's systems and controls are judged
      without changing a rule. Firms that treat consultations as a legal exercise
      routinely miss guide revisions, and the cost of missing this one is being measured
      in 2027 against expectations nobody internally read. Actionability 3: a
      supervisory expectation rather than a rule change, with firms expected to evidence
      a position. Reach 5 as it covers the whole FCA-supervised population for financial
      crime in a major jurisdiction.

    required_action: >-
      Read the draft guide changes against the firm's current financial crime framework
      before 24 December 2026 and decide whether to respond. Where the firm will not
      respond, still record which of the seven areas create a gap against current
      practice, because the revised guide becomes the examination standard regardless of
      whether the firm engaged with it.

    status: open
    supersedes: null

  - id: 2026-11-02-us-005
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: advisory
    title: >-
      FinCEN tells institutions to consider the reasons for delisting after the FATF
      removes four jurisdictions from increased monitoring, and repeats that risk-based
      diligence is not a basis for wholesale de-risking
    reference: FATF October 2026 plenary statements dated 2026-10-30
    published: 2026-10-30
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/financial-action-task-force-identifies-jurisdictions-anti-money-laundering-6
    verified: 2026-11-02

    entity_scope: [credit_institutions, payment_service_providers, money_service_businesses, crypto_asset_service_providers, e_money_institutions]
    functions_affected: [financial_crime, compliance, onboarding, risk, data]

    scores:
      actionability: 3
      reach: 5

    rationale: >-
      FinCEN informs US financial institutions that the FATF removed Bulgaria, Cote
      d'Ivoire, the Democratic Republic of the Congo and Monaco from its Jurisdictions
      Under Increased Monitoring list at the conclusion of its October 2026 plenary,
      and that the High-Risk Jurisdictions Subject to a Call for Action list is
      unchanged: Iran, the DPRK and Burma remain, Burma subject to enhanced due
      diligence but not countermeasures. The operative instruction is that institutions
      should consider the FATF's decisions and the reasons for delisting when assessing
      risk, under 31 C.F.R. 1010.610(a) and 1010.210, and that risk-based due diligence
      should not be used as a basis for wholesale or indiscriminate de-risking of any
      class of customers or institutions. Correspondent account prohibitions for North
      Korean and Iranian financial institutions are restated, citing 31 C.F.R. 1010.661
      for Iran. The second-order consequence is that the hard control here is
      relaxation, not restriction: adding a jurisdiction is a rule that writes itself,
      removing one is a judgement requiring an owner and a record, and FinCEN has
      effectively specified what the record should reference. There is also a silent
      systems effect, because country risk commonly drives review frequency, so four
      delistings re-time a population of customer reviews inside a system rather than at
      a committee. Worth keeping distinct in any rating change: a jurisdiction exits the
      list because it completed an action plan, not because its inherent risk fell.
      Actionability 3 as a supervisory expectation on which firms are expected to
      evidence a position, with no dated obligation. Reach 5 as every firm taking a FATF
      list as a country-risk input, cross-sector in a major jurisdiction. Recorded as a US
      record because the obligation described is FinCEN's and taxonomy.md and render.py
      allow only EU, UK and US. The four delistings and the unchanged call for action
      list were confirmed on the FATF statements of 30 October 2026, read on
      2026-11-07; verified records the date the FinCEN source was read.

    required_action: >-
      Before changing any country rating for Bulgaria, Cote d'Ivoire, the Democratic
      Republic of the Congo or Monaco, record what was considered and reference the
      reasons for delisting rather than the fact of it, with a named owner. Identify
      whether the country-risk methodology automatically re-times periodic reviews and,
      if so, minute the resulting change in review dates as a decision. Confirm no
      wholesale or class-based de-risking is applied or withdrawn on the basis of the
      list alone.

    status: open
    supersedes: null

  - id: 2026-11-02-eu-001
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: consultation_paper
    title: >-
      AMLA invites technology providers to express interest by 13 November 2026 in a
      roundtable on 30 November informing AMLA and EDPB Joint Guidelines on
      Partnerships for Information Sharing under Article 75 AMLR
    reference: >-
      AMLA call for expression of interest, technology providers roundtable on
      partnerships for information sharing
    published: 2026-10-30
    effective: null
    deadline: 2026-11-13
    deadline_type: consultation_close
    source_url: https://www.amla.europa.eu/call-expression-interest-technology-providers-roundtable-partnerships-information-sharing_en
    verified: 2026-11-02

    entity_scope: [all_regulated_firms, designated_non_financial_businesses]
    functions_affected: [financial_crime, compliance, data, legal, technology]

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      AMLA published on 30 October 2026 a call for expressions of interest from
      technology providers to join an online roundtable informing the Joint Guidelines
      on Partnerships for Information Sharing that AMLA and the European Data
      Protection Board are developing under Article 75 of the Anti-Money Laundering
      Regulation, which allows obliged entities, and where relevant competent
      authorities, to share specified information where strictly necessary to meet
      their AML/CFT obligations. Eligibility is limited to providers that currently
      support operational AML/CFT information-sharing arrangements, can demonstrate
      expertise in privacy-enhancing technologies such as secure multi-party
      information sharing, and have at least one engagement, pilot or deployment
      involving EU-based participants. Places are capped at twelve providers. The
      roundtable runs on 30 November 2026, 13:30 to 16:30 CET, online in English, and
      expressions of interest close on 13 November 2026 at 23:59 CET. Participation is
      voluntary and nothing binds an obliged entity, which holds actionability at 2,
      consistent with the AMLA roundtable record at 2026-10-06-eu-003. Reach is 4,
      matching that record, because the guidelines will apply across the obliged-entity
      population although only providers attend. Recorded because the guidelines will
      bind obliged entities and the calendar is the only place these dates surface. The
      consequence worth holding: consulting the vendors of privacy-enhancing systems
      first suggests guidance built around what can be shared without disclosing the
      underlying personal data, which would turn the question of whether a firm may
      share into an architecture question with a budget attached. Instrument type and
      deadline type follow 2026-10-06-eu-003: a call for input to inform guidelines,
      and a date by which input closes. submission_due is reserved for one-off filings
      whose miss costs the right to carry on an activity.

    required_action: >-
      Technology providers meeting the eligibility criteria: express interest by
      13 November 2026, 23:59 CET. Obliged entities in or considering an information
      sharing partnership: no action required, but brief the MLRO, the data protection
      officer and technology on the direction of travel, and note the 30 November
      roundtable so the resulting draft guidelines are not missed.

    status: open
    supersedes: null
