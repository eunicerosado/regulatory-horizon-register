items:

  - id: 2026-08-23-us-002
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: sanctions_action
    title: >-
      On 18 to 21 August 2026, OFAC issued three action sets
    reference: >-
      OFAC recent actions 20260818, 20260820 and 20260821
    published: 2026-08-18
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://ofac.treasury.gov/recent-actions
    verified: 2026-11-19

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - operations
      - technology

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      Three OFAC action sets on 18, 20 and 21 August, read on the dated recent-actions
      pages on 2026-11-19. On 18 August: International Criminal Court-related
      designations of two individuals, a Venezuela-related designation of a British
      Virgin Islands company, and ICC-related General License 12 authorising
      wind-down. On 20 August: counter-narcotics, counter-terrorism, Cuba-related and
      Iran-related designations, including an Ecuador-based cocaine trafficking
      network designated under Executive Order 14059 with several members also
      designated under Executive Order 13224, a Hizballah and IRGC-Qods Force cash
      network, and Cuban state-owned enterprises, together with Russia-related General
      License 131I and amended FAQs 1224, 1225 and 1265. On 21 August: no
      designations, but new Venezuela General Licenses 61 and 62 on telecommunications
      and FAQ 1266. The designations are routine list maintenance. The licence churn
      is the control point: Russia-related General License 131I is a lettered revision
      of an existing licence, so any control keyed to the licence number rather than
      its current text will silently apply superseded terms. Screening list ingestion
      is usually automated; general licence tracking usually is not. Verification on
      2026-11-19 corrected two claims: designations were made on 18 and 20 August
      only, not on 21 August; and the Venezuela licences of 21 August were new
      issuances, so the earlier statement that Venezuela licences moved twice inside a
      fortnight is not supported by these pages. The source_url is OFAC's undated
      listing, which no longer shows August; the dated pages are cited in reference.

    required_action: >-
      Re-check the text of any Venezuela- and Russia-related general licence
      relied on, rather than confirming the GL number is still current. Confirm
      whether general-licence terms are tracked in a controlled system or a
      spreadsheet, and who owns expiry.

    status: closed
    supersedes: null

  - id: 2026-08-23-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: supervisory_statement
    title: >-
      FCA warns on unregulated mini-bonds and loan notes, and states an
      expectation that banks, PSPs and professional firms report suspicious
      distribution
    reference: null
    published: 2026-08-20
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/consumers-warned-beware-risky-mini-bonds-and-loan-notes
    verified: 2026-08-24

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - compliance
      - onboarding

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      A consumer warning on unregulated loan notes and mini-bonds, using the
      failure of litigation funder Woodville Consultants Ltd as the case study;
      the FCA states it has issued over 1,200 warnings in 2026. Marketing
      speculative illiquid securities to retail investors has been banned since
      1 January 2021. The industry-facing part is the significant one: the FCA
      cannot supervise an issuer outside the perimeter, so it supervises the
      firms that touch the money instead, and names banks, payment providers,
      lawyers, accountants and auditors as expected to report suspicious
      distribution. Affected customers have no FOS or FSCS recourse, which
      concentrates recovery pressure on whoever remains solvent and regulated.

    required_action: >-
      Confirm whether the FCA warning list is an input to adverse-media and
      customer screening. Be able to evidence what the firm did on becoming
      aware of an in-scope issuer among its customers or counterparties.

    status: open
    supersedes: null

  - id: 2026-08-23-us-001
    jurisdiction: US
    regulator: Federal Trade Commission
    regulator_short: FTC
    instrument_type: enforcement
    title: >-
      On 17 August 2026, Doxo agreed to pay $2.1m to the FTC
    reference: null
    published: 2026-08-17
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ftc.gov/news-events/news/press-releases/2026/08/bill-payment-firm-doxo-pay-21-million-settle-ftc-allegations-it-deceived-consumers-charged-them-add
    verified: 2026-11-19

    entity_scope:
      - payment_service_providers
      - money_service_businesses
    functions_affected:
      - compliance
      - financial_crime
      - operations

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      In a 2024 complaint the FTC alleged that Doxo and co-founders Steve Shivers and
      Roger Parks used search ads and landing pages carrying billers' names, and
      sometimes their logos, to present Doxo as the official payment channel when it
      had no relationship with the overwhelming majority of those billers; added
      delivery fees that were not clearly disclosed; and deceptively signed consumers
      up to a recurring subscription. At the FTC's request a federal court found that
      Doxo violated the Restore Online Shoppers' Confidence Act by failing to clearly
      disclose subscription terms and failing to obtain consent for subscription
      charges. Under the proposed stipulated order, approved by the Commission 2 to 0
      and filed in the Western District of Washington, Doxo pays $2.1m for consumer
      redress, and the defendants are barred from misrepresenting affiliation with
      billers, using a biller's website address in any search advertisement,
      misrepresenting fees, and charging consumers without express informed consent.
      The order has the force of law only once the court approves and signs it. What
      makes this a control question rather than a news item is that the impersonation
      came from a company presenting itself as a legitimate payment channel, not from
      an external fraudster, which is precisely what impersonation detection is not
      built to catch. Verification on 2026-11-19 removed two claims the page does not
      support: that the court's finding came on partial summary judgment, and that
      Doxo had a compliance function.

    required_action: >-
      Establish whether the firm's paid-search keyword set and ad copy have ever
      been reviewed by second line, and who owns that review. Confirm whether
      brand-term bidding by third parties is monitored by the fraud function.

    status: open
    supersedes: null

  - id: 2026-08-23-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      On 19 August 2026, the FCA fined and banned the SVS ex-CEO
    reference: >-
      Final Notice 2026, Demetrios Christos Hadjigeorgiou
    published: 2026-08-19
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/fca-fines-bans-former-svs-securities-ceo
    verified: 2026-11-19

    entity_scope:
      - all_regulated_firms
      - investment_firms
    functions_affected:
      - compliance
      - legal
      - board

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      The FCA prohibited Demetrios Hadjigeorgiou from senior management functions and
      fined him £56,400 under sections 66 and 56 of the Financial Services and Markets
      Act 2000, after he settled and withdrew his referral to the Upper Tribunal.
      While he was chief executive of SVS Securities, a discretionary fund manager,
      from 1 May 2018 to 7 August 2019, the firm invested customers' money, including
      pension savings, in high-risk products while receiving significant payments from
      their issuers, and he failed to challenge a 10% reduction applied to customers'
      bond investments on sale, which generated £359,800 for SVS. The FCA found a
      breach of Statement of Principle 6. The operative detail is not the fine. The
      Final Notice, read on 2026-11-19, records that the Decision Notice of 25 April
      2024 imposed £84,600, and that on further consideration the FCA categorised the
      markdown conduct as a breach of Statement of Principle 6 rather than Statement
      of Principle 1, with no change to the factual findings, which produced the lower
      penalty; no settlement discount applied. The same facts, differently
      characterised, produce a materially different sanction, and that
      characterisation boundary is where SMCR defence arguments actually live.

    required_action: >-
      Monitor only. No obligation change. Worth reading the conduct sections of
      the Final Notice against current senior-manager fitness and propriety
      files, and noting the April 2024 to August 2026 interval when modelling
      enforcement timelines.

    status: open
    supersedes: null

  - id: 2026-08-23-uk-002
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      On 18 August 2026, the FCA banned Beauforce's Howard Duckett
    reference: null
    published: 2026-08-18
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/fca-bans-senior-manager-lack-honesty-and-integrity
    verified: 2026-11-19

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - compliance
      - board

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      The FCA banned Howard Roland Duckett, a senior manager at debt management firm
      Beauforce Corporation Limited approved for the SMF3 and SMF16 functions, from
      working in financial services for a serious lack of honesty and integrity. On 13
      November 2020 the High Court disqualified him as a company director for 10
      years, effective 4 December 2020, over records at an unrelated company, and
      found that he repeatedly lied and relied on fabricated evidence to deny he was a
      director, including falsely claiming that a fictitious individual ran the
      business. He did not tell the FCA about the disqualification. His reference of
      the FCA's Decision Notice to the Upper Tribunal was struck out, and the FCA had
      restricted Beauforce from regulated activities in November 2025. Read alongside
      the SVS notice published the following day, the pairing shows the FCA pursuing
      individuals rather than firms in the same week. The disqualification
      non-disclosure is the transferable point: it is a public record a firm can check
      for itself rather than relying on the individual to disclose it. Verification on
      2026-11-19 corrected the record: the lying and fabricated evidence were findings
      of the High Court in the disqualification proceedings, not conduct towards the
      FCA as the record previously stated.

    required_action: >-
      Monitor only. Confirm that director disqualification registers are checked
      as part of senior-manager onboarding and periodic fitness and propriety
      review.

    status: open
    supersedes: null

  - id: 2026-08-23-eu-001
    jurisdiction: EU
    regulator: European Securities and Markets Authority
    regulator_short: ESMA
    instrument_type: consultation_paper
    title: >-
      ESMA consults on the reporting framework for clearing activity at
      recognised third-country CCPs
    reference: null
    published: 2026-08-18
    effective: null
    deadline: 2026-10-12
    deadline_type: consultation_close
    source_url: https://www.esma.europa.eu/press-news/esma-news/esma-consults-reporting-framework-clearing-activity-recognised-third-country
    verified: 2026-08-24

    entity_scope:
      - credit_institutions
      - investment_firms
    functions_affected:
      - compliance
      - operations
      - data

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      A consultation on how clearing activity at recognised third-country CCPs
      is to be reported. Low current materiality and high forward significance —
      the two are not the same thing. Reporting frameworks are how a supervisor
      assembles an evidence base before acting, and the question this one is
      built to answer is how much EU clearing still sits outside the EU. The
      obligation arriving now is data collection. Any relocation pressure would
      arrive later, on the strength of what the data shows.

    required_action: >-
      Consider responding. Feedback on the reporting framework, templates and
      format is invited by 12 October 2026, confirmed on the consultation page.

    status: open
    supersedes: null

  - id: 2026-08-23-uk-004
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: supervisory_statement
    title: >-
      FCA appoints financial services attachés to Mumbai and Abu Dhabi
    reference: null
    published: 2026-08-17
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/fca-expands-global-presence-new-attaches-india-and-uae
    verified: 2026-08-24

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - compliance

    scores:
      actionability: 1
      reach: 3

    rationale: >-
      Recorded rather than briefed. The rubric excludes routine personnel
      announcements, and on its face this is one; it is kept because the
      postings are structural rather than personal. Sabina Saini takes post at
      the British Deputy High Commission in Mumbai from 10 August and Darine
      Obeid at the British Embassy in Abu Dhabi from 31 August, into two of the
      highest-volume, highest-scrutiny corridors into UK financial services. The
      stated remit is trade and investment promotion and the release does not
      mention financial crime. Permanent presence in a jurisdiction tends to
      precede improved information flow, which tends to precede better-informed
      supervisory questions. Nothing follows from this today.

    required_action: >-
      Monitor only. Note for the next review of the high-risk jurisdiction
      matrix whether UAE and India corridor entries are static.

    status: open
    supersedes: null
