    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-announces-withdrawals-proposed-digital-asset-related-rules
    verified: 2026-10-12

    entity_scope:
      - crypto_asset_service_providers
      - money_service_businesses
      - credit_institutions
    functions_affected:
      - financial_crime
      - compliance
      - technology
      - board

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      FinCEN announced on 5 October 2026 that it is withdrawing two proposed
      rules on convertible virtual currency. The first would have imposed
      recordkeeping, verification and reporting requirements on certain CVC
      transactions, including those involving unhosted wallets, withdrawn by
      Federal Register document 2026-20430. The second was the proposed
      special measure treating CVC mixing as a class of transactions of
      primary money laundering concern, withdrawn by document 2026-20429. Both
      withdrawal notices were filed with the Federal Register on 5 October
      2026 and scheduled for publication on 6 October 2026; the mixing
      withdrawal was read on the Federal Register public inspection page,
      which gives a filing time of 08:45 on 5 October. FinCEN said it
      considered the public comments submitted on both proposals and framed the
      withdrawals as part of the administration's deregulatory agenda and its
      effort to make digital asset rules fit-for-purpose. No official was
      quoted on the release and the original proposal dates, dockets and RINs
      were not stated there, so none is recorded. Actionability is 2: nothing
      binds and nothing becomes unlawful, but a planning assumption moves, and
      that is the level 2 reading. Reach is 5 because the withdrawn proposals
      would have reached covered institutions across banking, money services
      and virtual asset activity rather than one licence category. Two
      consequences. First, firms that declined mixer-exposed deposits or built
      mixing-attribution rulesets have partly been relying on the direction of
      travel, and that support is gone; the position now has to be written
      down as the firm's own risk appetite with a named owner, rather than
      attributed to a pending rule. Second, the unhosted-wallet withdrawal
      leaves the self-custody boundary open in the US while the EU
      transfer-of-funds regime and the FATF standard treat it as closed, so a
      cross-border firm cannot operate a single rule set. Read against
      2026-10-06-us-001, the pattern is a change of instrument rather than
      retreat: the A7 Network special measure proposal published 5 October is
      still live, so class-based rules are giving way to named-target
      measures, which moves the burden from building a control once to
      absorbing designations continuously. Instrument type is recorded as
      rule_withdrawn, added to taxonomy.md on 2026-10-13 for this record:
      the artefacts are Federal Register documents withdrawing proposed
      rules, and recording them as rule_proposed would have misstated the
      direction of travel, which is the point of the item. Continues the
      thread at 2026-10-06-us-001.

    required_action: >-
      Firms with crypto exposure: restate the firm's own position on
      mixer-exposed flow and on the self-custody boundary as a documented risk
      appetite with a named owner, rather than as anticipation of a US rule.
      Where a global rule set was being designed to the withdrawn proposals,
      re-baseline it on the EU transfer-of-funds regime and the FATF standard,
      which have not moved. Confirm the sanctions-screening and designation
      ingestion capability can absorb named-target special measures at pace,
      because that is the instrument now in use.

    status: open
    supersedes: null

  - id: 2026-10-12-us-003
    jurisdiction: US
    regulator: Department of Justice
    regulator_short: DOJ
    instrument_type: supervisory_statement
    title: >-
      DOJ National Fraud Enforcement Division issues Directive 26-13,
      requiring prosecutors to charge fraud across tax, securities, consumer
      fraud and cybercrime authorities and to use pre-indictment asset
      seizures and digital-infrastructure takedowns
    reference: Directive 26-13; DOJ press release 26-1160
    published: 2026-10-08
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.justice.gov/opa/pr/assistant-attorney-general-colin-m-mcdonald-issues-memorandum-national-fraud-enforcement-1
    verified: 2026-10-12

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - money_service_businesses
      - crypto_asset_service_providers
    functions_affected:
      - financial_crime
      - operations
      - legal
      - compliance

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      The Justice Department published Directive 26-13 on 8 October 2026,
      issued by Assistant Attorney General Colin M. McDonald of the National
      Fraud Enforcement Division and setting out the Division's prosecutorial
      methodology; the release is numbered 26-1160 and was updated 9 October
      2026. It requires prosecutors to charge fraud using tax, securities
      fraud, consumer fraud and cybercrime authorities together, which the
      release calls a significant operational shift, and to use early,
      pre-indictment asset seizures and digital-infrastructure takedowns to
      halt schemes and freeze assets in real time. It also directs prosecutors
      to develop cooperators, to prosecute corporate wrongdoers, to seek
      arrest and detention in appropriate cases, and to advocate thoroughly at
      sentencing. The release cites a Government Accountability Office
      estimate that the federal government loses between $233 billion and
      $521 billion a year to fraud. Stated priorities are to prosecute fraud
      whatever its size or complexity, to preempt and dismantle networks
      before they inflict widespread harm, and to restore public confidence in
      federal spending. The full directive is linked from the release; the
      release does not describe self-disclosure, monitor or declination
      policy, and nothing is recorded here about those. Actionability is 2: no
      obligation attaches to any firm, so this is direction of travel, but the
      planning assumption that moves is operational rather than legal. Reach
      is 5 because the effect runs across US financial institutions generally.
      The consequence worth recording: pre-indictment seizure means legal
      process arrives earlier and with less context, as a seizure warrant or
      restraint on an account whose customer has not been charged and is not
      publicly linked to anything. That is a workflow question before it is a
      legal one — who decides whether to exit, what the SAR says, what the
      customer is told, and how the firm avoids tipping off while also
      avoiding an unexplained freeze it cannot justify to a complaints
      function. Multi-authority charging compounds it, because one customer's
      conduct now generates overlapping requests from tax, securities and
      cyber angles, typically answered by three teams inconsistently.
      Digital-infrastructure takedowns have a detection consequence: when
      infrastructure is seized mid-scheme, inbound mule flow stops abruptly
      rather than tapering, which is observable for a firm looking for it.
      Instrument type is recorded as supervisory_statement, the house answer
      for a DOJ statement of its own approach, consistent with
      2026-08-25-us-003. DOJ is a prosecuting authority rather than a
      supervisor, so the label is a fit by function — an authority's
      published statement of how it will act — rather than by form; per the
      non-equivalence note in taxonomy.md the distinction is stated here
      rather than forced into a new value.

    required_action: >-
      US institutions: name the owner of the legal-process workflow end to
      end — receipt, validation, account restraint, customer communication,
      SAR decision and exit decision — and test it against a restraint on an
      uncharged customer rather than a post-indictment one. Confirm that
      overlapping requests about one customer from different authorities are
      answered from one record rather than by three teams separately. Flag
      abrupt cessation of inbound mule flow as a monitoring signal rather than
      a resolved alert.

    status: open
    supersedes: null

  - id: 2026-10-12-us-004
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: enforcement
    title: >-
      OFAC settles with freight forwarder Pegasus Worldwide Logistics for
      $175,015 over ten apparent violations, six of which were for failing to
      respond fully to an OFAC subpoena over six months
    reference: >-
      OFAC settlement with Pegasus Worldwide Logistics, recent actions
      9 October 2026
    published: 2026-10-09
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://ofac.treasury.gov/recent-actions/20261009
    verified: 2026-10-12

    entity_scope:
      - all_regulated_firms
      - credit_institutions
    functions_affected:
      - financial_crime
      - operations
      - legal
      - compliance

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      OFAC announced a $175,015 settlement with Pegasus Worldwide Logistics on
      9 October 2026, resolving potential civil liability for ten apparent
      violations. Four were apparent violations of the Illicit Drug
      Trafficking Sanctions Regulations: between September 2023 and February
      2024 the company, a freight forwarder, allegedly dealt in blocked
      property by facilitating the importation of a machine supplied by a
      designated company. The other six were apparent violations of the
      Reporting, Procedures and Penalties Regulations, for failing to respond
      fully to an OFAC subpoena over a six-month period. OFAC determined the
      conduct was non-egregious and not voluntarily disclosed. Scored 3 on
      actionability, consistent with the enforcement records at
      2026-09-07-uk-001 and 2026-09-14-us-004, because the transferable point
      is a supervisory expectation firms should be able to evidence a position
      on rather than a rule change. Reach is 3: the respondent is one firm in
      a niche activity, but the count distribution generalises to any firm
      that receives administrative process. The reason to record a small
      settlement: most sanctions programmes are built around the first four
      violations — screen the counterparty, catch the designated supplier, do
      not move blocked goods — and almost none are built around the other six.
      A subpoena response is a project: locating records across systems,
      reconstructing a transaction chain two years old, and producing it in
      usable form to a deadline. It typically falls between a legal function
      treating it as discovery and an operations function treating it as
      someone else's, with no owner and no budget. OFAC has priced that
      failure separately and, by count, more heavily than the underlying
      conduct. Thematically this sits with 2026-09-28-us-002, where the SEC
      priced the handling of its own examination process rather than only the
      underlying control gap; the pattern across both is that a regulator's
      own process is becoming a scored control.

    required_action: >-
      Name the owner of an OFAC, OFSI or other administrative information
      request end to end, with a documented process covering record location
      across systems, completeness review and deadline management. Test
      whether the firm could produce a complete record of a two-year-old
      transaction or shipment within 30 days. Firms underwriting logistics,
      freight forwarding and customs broking clients: note that the blocked
      property exposure in this case arose through facilitating an
      importation rather than through a payment.

    status: open
    supersedes: null
