# RegWatch register — week ending 2026-10-12
# Converted from the weekly brief. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.
#
# COMPLETE for the 12 October edition, with two additions and one deliberate
# omission, all explained in window.note below. Band governs treatment, not
# whether an item is recorded: Medium items are held so that a later item has
# something to move against.

window:
  start: 2026-10-05
  end: 2026-10-12
  coverage: full
  note: >-
    All seven items briefed in the 12 October edition are recorded, as ten
    records. Three splits and two additions account for the difference. The
    OFAC action day of 9 October is split into the Pegasus Worldwide Logistics
    settlement (enforcement) and the designation of the International Criminal
    Court with four general licences (sanctions_action), because they carry
    different instrument types and different actionability. The UK Money
    Laundering and Terrorist Financing (Amendment) Regulations 2026 are added
    as two records — new regulation 34A, commencing 1 February 2027, and the
    substituted Schedule 6B, taking effect for all remaining purposes on
    25 October 2027 — because they carry different obligations and different
    dates. That instrument is out of window and was not briefed, but the
    edition carried both dates in prose, and a dated obligation held only in
    prose never reaches the generated calendar. Its made date of 9 June 2026,
    its commencement provisions and the text of regulation 34A were read on the
    made instrument on legislation.gov.uk on 2026-10-13. Deliberate omission: OFSI added FAQ 205, "What happens to
    specific licences when a designated person is delisted?", on 9 October 2026
    per the publication's change log. It is squarely in the lane and follows the
    frozen asset review at 2026-10-06-uk-002, but only the title could be read
    — the HTML FAQ page truncates before FAQ 205 on every read attempted, and
    it also reports a last-updated date of 29 September 2026, which does not
    match the 9 October change log entry. Rather than record an unread answer,
    it is left out and carried to the next sweep. Every other primary source
    below was read on 2026-10-12 and `verified` records that date. The edition
    could not read the Europol newsroom (JavaScript-rendered; the site-scoped
    search fallback returned no dates), the Council of the EU press release
    listing (gated), or the European Commission finance newsroom, so their
    absence here is not a finding of silence. The ESMA press releases page was
    read but served a listing whose most recent item was dated 27 July 2026,
    which is a stale or partial listing rather than confirmed silence, and is
    treated as incompletely read. The Payment Systems Regulator news page and
    the FATF news page were read directly and carried nothing in the window.

items:

  - id: 2026-10-12-uk-001
    jurisdiction: UK
    regulator: HM Treasury
    regulator_short: HMT
    instrument_type: legislation
    title: >-
      From 1 February 2027 cryptoasset exchange and custodian wallet providers
      must apply enhanced due diligence, senior management approval and a shell
      bank prohibition to third-country correspondent relationships, under new
      regulation 34A of the Money Laundering Regulations
    reference: >-
      Money Laundering and Terrorist Financing (Amendment) Regulations 2026,
      S.I. 2026/621, regulation 20 inserting regulation 34A into S.I. 2017/692
    published: 2026-06-09
    effective: 2027-02-01
    deadline: 2027-02-01
    deadline_type: compliance_date
    source_url: https://www.legislation.gov.uk/uksi/2026/621/made
    verified: 2026-10-13

    entity_scope:
      - crypto_asset_service_providers
      - credit_institutions
    functions_affected:
      - financial_crime
      - compliance
      - onboarding
      - legal
      - board

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      Regulation 20 of the Money Laundering and Terrorist Financing (Amendment)
      Regulations 2026 inserts a new regulation 34A into the Money Laundering,
      Terrorist Financing and Transfer of Funds (Information on the Payer)
      Regulations 2017. Regulation 1(4) of the amending instrument provides
      that regulation 20, and regulation 36(b) which adds regulation 34A to
      Schedule 6, come into force on 1 February 2027. Regulation 34A applies
      where a cryptoasset exchange provider or custodian wallet provider acts
      as correspondent to a respondent providing similar services from a third
      country. In addition to the regulation 33 measures, the correspondent
      must gather information about the respondent, check its reputation and
      the quality of its supervision, assess its AML/CFT controls, document
      each party's responsibilities, and obtain senior management approval
      before establishing a new correspondent relationship. It must also be
      satisfied that the respondent has verified and monitors customers with
      direct access to the correspondent's accounts and can provide
      information on request. Regulation 34A(2) prohibits entering into or
      continuing a correspondent relationship with a shell bank, and 34A(3)
      requires enhanced measures to avoid relationships with credit or
      financial institutions known to permit shell banks to use their
      accounts. The score is 5 on actionability because this is a binding
      obligation with a date fixed in the instrument, and it requires a
      control that does not currently exist in most firms: correspondent due
      diligence has been a banking discipline, and the population now subject
      to it has largely never built it. Reach is 4 rather than 5 because the
      obligation attaches to a defined licence category, with credit
      institutions caught only where they sit in such a relationship. The
      shell bank prohibition in 34A(2) is the provision with the sharpest
      consequence, because it bites on continuing relationships and not only
      new ones, so a relationship already on the book must be assessed rather
      than grandfathered. Recorded out of window deliberately: the instrument
      is not new, but the 1 February 2027 date was carried only in the
      12 October edition's prose and belongs in the calendar. The instrument
      was made on 9 June 2026, as stated in its header and signature block on
      the made instrument page on legislation.gov.uk, read on 2026-10-13;
      `published` records that date. The 1 February 2027 date is stated
      expressly in regulation 1(4). The default commencement in regulation
      1(2), 21 days after the day the Regulations were made, governs the
      instrument's other provisions and is not this record's obligation.
      Continues the cryptoasset thread at 2026-10-06-uk-001.

    required_action: >-
      Cryptoasset exchange providers and custodian wallet providers: identify
      every third-country correspondent relationship, including those already
      on the book, and build the regulation 34A file for each — respondent
      information, reputation and supervision checks, an AML/CFT control
      assessment, a written division of responsibilities, and evidenced senior
      management approval. Establish who holds the senior management approval
      mandate before 1 February 2027 rather than after. Screen the respondent
      population for shell banks and for institutions permitting shell bank
      access, and plan exits for relationships that cannot be continued. Credit
      institutions in such relationships: confirm which side of the
      correspondent-respondent relationship the firm sits on, because the
      obligation follows the correspondent role and not the licence.

    status: open
    supersedes: null

  - id: 2026-10-12-uk-002
    jurisdiction: UK
    regulator: HM Treasury
    regulator_short: HMT
    instrument_type: legislation
    title: >-
      From 25 October 2027 a substituted Schedule 6B governs changes in control
      of registered cryptoasset businesses, taking effect for all remaining
      purposes on the day the UK cryptoasset regime commences
    reference: >-
      Money Laundering and Terrorist Financing (Amendment) Regulations 2026,
      S.I. 2026/621, regulation 37 substituting Schedule 6B to S.I. 2017/692
    published: 2026-06-09
    effective: 2027-10-25
    deadline: 2027-10-25
    deadline_type: application_date
    source_url: https://www.legislation.gov.uk/uksi/2026/621/made
    verified: 2026-10-13

    entity_scope:
      - crypto_asset_service_providers
    functions_affected:
      - legal
      - compliance
      - board

    scores:
      actionability: 4
      reach: 4

    rationale: >-
      Regulation 37 of the amending instrument substitutes Schedule 6B to the
      Money Laundering Regulations 2017, which governs changes in control of
      registered cryptoasset businesses. Regulation 1(5) splits its
      commencement: paragraphs 1, 2 and 5 of the new Schedule take effect
      21 days after the Regulations are made, and the substitution takes effect
      for all other purposes on 25 October 2027. Recorded separately from
      2026-10-12-uk-001 because it carries a different obligation, a different
      date and a different set of affected functions. The date is the point
      worth holding: 25 October 2027 is also the day the UK cryptoasset regime
      commences and the date already recorded at 2026-10-06-uk-001, so a firm
      going through the FCA authorisation gateway and a corporate transaction
      in the same period will meet both on the same day. Actionability is
      scored 4 rather than 5 because the obligation is binding with a dated
      application but is contained to the legal and corporate governance
      function rather than requiring systems or monitoring change, which is
      the one-function limb of level 4 in rubric.md; the dated application
      awaiting commencement also fits the limb added on 2026-10-06. Reach is 4
      because it attaches to a defined licence category. The partial
      commencement is the trap: part of the new Schedule is already live and
      part is not, so a change-in-control question asked in 2027 has two
      possible answers depending on which paragraph it turns on. The
      instrument was made on 9 June 2026, read on the made instrument page on
      2026-10-13, so the 21-day limb fell 21 days after that date, at the end
      of June 2026, and is already in force. Continues the thread at
      2026-10-06-uk-001.

    required_action: >-
      Registered cryptoasset businesses and their advisers: read the
      substituted Schedule 6B and establish which paragraphs are already in
      force and which arrive on 25 October 2027, before relying on either
      position in a transaction. Where a change in control is contemplated
      across that date, confirm which notification regime applies and build
      the timetable around 25 October 2027 rather than discovering it.

    status: open
    supersedes: null

  - id: 2026-10-12-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: report
    title: >-
      FCA publishes survey findings on corporate finance firms' compliance
      arrangements, naming the governance artefacts firms lack and committing
      to engage further with selected firms on the adequacy of compliance
      resources
    reference: >-
      FCA survey of corporate finance firms' compliance functions, flagged in
      the Regulatory Priorities Report
    published: 2026-10-08
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/blogs/strong-compliance-functions-support-trusted-corporate-finance-markets
    verified: 2026-10-12

    entity_scope:
      - investment_firms
    functions_affected:
      - compliance
      - board
      - legal
      - risk

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      The FCA surveyed 411 corporate finance firms and received 382 responses,
      publishing the findings on 8 October 2026 under the name of Jamie
      Whitehorn, Head of Trading Venues and Corporate Finance Firms; the page
      records 6 October 2026 as first publication. The population is small:
      64% have nine or fewer employees and 89% fewer than 50. Sixty-three per
      cent have a compliance function carrying other business
      responsibilities, which the FCA notes can create conflicts where
      compliance helps generate revenue, and 90% use some form of third-party
      compliance support. Forty-seven per cent carry out all the activities
      surveyed. Of those that do not: 140 firms do not include regulatory
      compliance in staff performance assessments, 90 have no whistleblowing
      arrangements, 82 have no breach register, 82 have no compliance
      attendance at management body meetings, 82 produce no annual compliance
      report to the management body, 75 have no compliance sign-off for
      certain business actions, and 74 do no compliance monitoring of
      complaints handling. The FCA said compliance should be a culture
      embedded by senior managers rather than "simply a series of tasks", that
      senior management remains responsible where third parties provide
      support and firms must "stay actively involved", and that for the 32
      firms in the sample holding public markets roles — AIM nominated
      adviser, AQSE corporate adviser, listing sponsor — "strong and credible
      challenge is essential". Scored 3 on actionability because this is a
      supervisory expectation rather than a rule change, and firms are
      expected to be able to evidence a position; the FCA states it will
      engage further with selected firms on the adequacy and effectiveness of
      compliance resources, which is what gives the expectation teeth. Reach
      is 3 because the surveyed population is a business-model sub-population
      rather than a whole licence category, though the read-across to any
      small authorised firm where the compliance officer also holds a
      commercial role is the more useful part. The structural point: every
      gap the FCA names is an evidentiary artefact rather than a control — a
      register, a report, a minute, a sign-off, a performance objective — and
      publishing the base rates tells a firm both what will be asked and how
      unusual it is to be missing it. The conflicts finding is the harder one,
      because in a nine-person firm proportionality has been carrying the
      argument, and the FCA's position is that proportionate is acceptable
      only where it still delivers high standards of conduct and effective
      conflicts management, which is a judgment about outcomes answered with
      records. Instrument type is recorded as report: the artefact is a blog
      post, but its content is survey findings with stated expectations and a
      supervisory follow-up, which is what the UK column of report describes
      as a thematic review.

    required_action: >-
      Corporate finance firms, and small authorised firms generally: check
      whether each artefact the FCA counted exists and is current — breach
      register, annual compliance report to the management body, compliance
      attendance at that body, whistleblowing arrangements, compliance
      sign-off, compliance monitoring of complaints handling, and regulatory
      compliance in staff performance objectives. Where the compliance
      function also carries commercial responsibilities, document how the
      conflict is managed rather than asserting that it is. Where third-party
      compliance support is used, evidence the firm's own active involvement
      and the senior manager who owns the output.

    status: open
    supersedes: null

  - id: 2026-10-12-uk-004
    jurisdiction: UK
    regulator: Prudential Regulation Authority
    regulator_short: PRA
    instrument_type: consultation_paper
    title: >-
      PRA consults until 7 February 2027 on indexing 128 regulatory thresholds
      to nominal UK GDP, with the first automatic update on 1 July 2031 and
      five-yearly updates thereafter
    reference: CP13/26
    published: 2026-10-07
    effective: null
    deadline: 2027-02-07
    deadline_type: consultation_close
    source_url: https://www.bankofengland.co.uk/news/2026/october/regulatory-thresholds-set-to-shift-to-automatic-increases
    verified: 2026-10-12

    entity_scope:
      - credit_institutions
      - insurers
    functions_affected:
      - compliance
      - finance
      - risk
      - board

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      The Bank of England announced on 7 October 2026 that the PRA proposes
      indexing 128 regulatory thresholds for banks, insurers and credit unions
      to nominal UK GDP, replacing ad hoc manual updates. The thresholds
      determine which rules apply to a firm, how they apply and what the firm
      must report. The largest is the £320 billion total assets threshold for
      detailed capital reporting; the smallest is a £7,500 threshold covering
      amounts an individual owes a credit union. Others named are the size of
      an insurer subject to Solvency UK and the Small Domestic Deposit Takers
      total assets threshold. The first automatic update would be 1 July 2031,
      with updates every five years thereafter. The consultation opened
      7 October 2026 and closes 7 February 2027. Thresholds jointly owned with
      the FCA are excluded and covered in a parallel discussion paper described
      on the page as Section 4 of CP13/26. Nothing binds yet, which fixes
      actionability at 2, consistent with the proposed-rule scoring at
      2026-10-06-us-001 and 2026-10-06-us-003. Reach is scored 4 rather than 5
      because, although the instrument covers banking, insurance and credit
      unions, the firms materially affected are those sitting near a
      threshold; recording 5 would overstate it. Recorded despite sitting at
      the edge of the register's financial-crime lane, because thresholds
      determine which reporting regimes apply and the 7 February 2027 date is
      a real consultation close. Two consequences worth holding. For a firm
      growing into a threshold, the line now moves away from it as nominal GDP
      rises, so a crossing planned for a given year may not happen and a
      programme built around it needs re-planning. For everyone else, a fixed
      threshold was an event that forced a firm to re-read which rules applied,
      and indexation removes the event — by 2031 nobody will remember that the
      number moved, so which regime a firm is in becomes a question with a
      drifting answer and no diarised moment to ask it. The cost falls on
      whoever maintains the regulatory inventory.

    required_action: >-
      Banks, building societies, credit unions and insurers within reach of a
      named threshold: identify which of the 128 thresholds the firm sits
      close to, and re-test any plan built around crossing one on a fixed
      date. Respond by 7 February 2027 where indexation changes the planning
      assumption. Separately, name the owner of the regulatory inventory and
      the review that re-checks threshold applicability, because from 2031 no
      threshold change will announce itself.

    status: open
    supersedes: null

  - id: 2026-10-12-eu-001
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: consultation_paper
    title: >-
      AMLA consults until 3 November 2026, via a public hearing that day, on
      draft RTS establishing a central AML/CFT database, including the
      materiality threshold above which a supervisor must report a breach
    reference: >-
      AMLA draft RTS establishing a central AML/CFT database
    published: 2026-10-07
    effective: null
    deadline: 2026-11-03
    deadline_type: consultation_close
    source_url: https://www.amla.europa.eu/press-release-amla-consults-draft-standards-eu-wide-amlcft-database_en
    verified: 2026-10-12

    entity_scope:
      - all_regulated_firms
      - designated_non_financial_businesses
    functions_affected:
      - compliance
      - financial_crime
      - data
      - legal

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      AMLA opened a consultation on 7 October 2026 on draft regulatory
      technical standards establishing a central AML/CFT database. The
      database brings together data on individual obliged entities and on
      supervisors and their activities, and becomes the single point for
      supervisory authorities in the EU to report information, which
      authorities can also retrieve. The RTS set out how and when supervisors
      report, the scope and level of detail required, a materiality threshold
      above which a breach must be reported, and the conditions under which
      AMLA may request further information, with a staged entry into force in
      some cases to give supervisors time to adapt. AMLA states the database
      draws on data supervisors already hold or will collect anyway and adds
      no new reporting costs for obliged entities. The consultation runs via a
      public hearing on 3 November 2026, 14:00 to 16:00 CET, with a 16:00 CET
      deadline that day; the deadline was read on AMLA's public consultations
      page, which lists this as the only open consultation. Nothing binds an
      obliged entity, which fixes actionability at 2 and is consistent with
      the AMLA roundtable record at 2026-10-06-eu-003. Reach is 4, matching
      that record, because the database covers the whole obliged-entity
      population but the direct reporting duty sits with supervisors. The
      statement that there is no new cost for obliged entities is accurate
      and beside the point. The consequence is that a supervisory finding
      stops being local: today a breach recorded by one national supervisor
      reaches another through a call, a college meeting, or not at all, which
      is why a group can be in a difficult conversation in one member state
      and a routine one in another. A central record with a defined
      materiality threshold means any EU supervisor can read a group's
      history before speaking to it, and inconsistency between what a group
      tells different supervisors becomes visible by default rather than by
      accident. The materiality threshold is the whole design — set low, every
      finding travels; set high, only crises are recorded — and it is being
      settled by supervisors talking to supervisors unless obliged entities
      respond. Instrument type is recorded as consultation_paper: the artefact
      is a consultation on draft RTS, so the final instrument will be a
      technical_standard, but what is published now is the call for input.

    required_action: >-
      Groups operating in more than one member state, and any firm mid-way
      through a remediation plan agreed with one national supervisor: read the
      draft RTS and respond on the materiality threshold and the scope and
      level of detail of supervisor reporting by 3 November 2026, 16:00 CET.
      Separately and regardless of whether the firm responds, reconcile what
      has been told to each national supervisor about the same facts, because
      the database makes divergence legible. Identify who owns the record of
      open supervisory findings across the group.

    status: open
    supersedes: null

  - id: 2026-10-12-eu-002
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: report
    title: >-
      AMLA asks the Commission to bring staking, lending and borrowing into
      scope, define effective control over DeFi arrangements and review why
      certain asset-referenced token issuers are not obliged entities, in its
      MiCA review response
    reference: >-
      AMLA response to the European Commission targeted consultation on the
      review of MiCA
    published: 2026-10-07
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.amla.europa.eu/amla-identifies-amlcft-priorities-review-mica_en
    verified: 2026-10-12

    entity_scope:
      - crypto_asset_service_providers
    functions_affected:
      - compliance
      - legal
      - financial_crime
      - risk

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      AMLA published its response to the Commission's targeted consultation on
      the MiCA review on 7 October 2026, assessing the framework from an
      AML/CFT perspective. It raises five areas: bringing staking, lending and
      borrowing within the regulatory framework given their specific ML/TF
      risks; a clear legal definition of DeFi arrangements with common
      criteria for determining who exercises effective control; a consistent
      EU-wide approach to unauthorised stablecoins to remove legal
      uncertainty; a review of the interaction by which certain
      asset-referenced token issuers are not treated as obliged entities; and
      clearer information requirements to support cross-border supervision of
      service providers. AMLA states it stands ready to support the Commission
      in its review. Nothing binds, which fixes actionability at 2, matching
      the ESMA MiCA response at 2026-10-06-eu-002 and the EBA priorities at
      2026-09-28-eu-004. The reason to record it is that it completes a
      pattern rather than adding a view: the EBA asked about definitions and
      multi-issuer stablecoin reserves, ESMA asked for powers to freeze assets
      and block websites, and AMLA has now asked about the obliged-entity
      perimeter itself. Three authorities approaching the same consultation
      from prudential, markets and AML mandates have each concluded that MiCA
      regulates the wrong set of activities, which is a stronger planning
      signal than any one of the three submissions. Two limbs carry
      disproportionate weight. A defined test for effective control over a DeFi
      arrangement will be applied to structures documented specifically to
      establish that nobody exercises control, and those documents were drafted
      against no definition. And becoming an obliged entity is not a tuning
      exercise for an asset-referenced token issuer currently outside the
      population: it is a business-wide risk assessment, a CDD programme,
      monitoring, an MLRO and a reporting line into a national FIU, none of
      which exists today. Instrument type is recorded as report, matching the
      treatment of the ESMA response at 2026-10-06-eu-002; the artefact is a
      consultation response rather than a consultation, and report is the
      closest fit in taxonomy.md. Continues the thread at 2026-10-06-eu-002
      and 2026-09-28-eu-004.

    required_action: >-
      No action required. Planning assumptions to move: do not build a
      staking, lending or borrowing product on the assumption it stays outside
      the AML/CFT perimeter; re-read any structure paper asserting that no
      person exercises effective control over a DeFi arrangement, on the
      assumption a definition will be applied to it; and asset-referenced
      token issuers currently outside the obliged-entity population should
      size what an AML/CFT programme would cost to stand up rather than
      discovering it on adoption.

    status: open
    supersedes: null

  - id: 2026-10-12-us-001
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: sanctions_action
    title: >-
      OFAC adds the International Criminal Court to the SDN List and issues
      four general licences covering transactions with the Court,
      telecommunications and enterprise software, pension payments and certain
      detainees
    reference: >-
      OFAC recent actions 9 October 2026; ICC-EO14203; ICC-related General
      Licences 13, 14, 15 and 16
    published: 2026-10-09
    effective: 2026-10-09
    deadline: null
    deadline_type: null
    source_url: https://ofac.treasury.gov/recent-actions/20261009
    verified: 2026-10-12

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - operations
      - compliance
      - legal

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      OFAC added the International Criminal Court to the SDN List on
      9 October 2026, recorded as INTERNATIONAL CRIMINAL COURT, Oude
      Waalsdorperweg 10, 2597 AK, The Hague, Netherlands, established
      01 Jul 2002, tagged [ICC-EO14203]. It issued four ICC-related general
      licences the same day: GL 13 authorising certain transactions involving
      the Court, GL 14 authorising certain transactions related to
      telecommunications and enterprise software, GL 15 authorising
      transactions related to pension payments, and GL 16 authorising certain
      transactions related to certain ICC detainees. Scored 5 on actionability
      on the same basis as every other same-day designation record in this
      register: a listing has immediate effect, list ingestion and screening
      must run, and exposure must be blocked or worked to a licence. Reach is
      4, consistent with 2026-08-23-us-002, 2026-08-25-us-001,
      2026-08-30-us-002 and 2026-09-14-us-003. What distinguishes this
      designation operationally is that the designated party is an
      international organisation rather than a company or an individual, so
      the exposure sits in categories most sanctions programmes do not model:
      payroll and pension flows, telecommunications and software supply,
      professional and legal services, and detainee-related payments. Those
      are precisely the four categories the general licences address, which
      means the licences define the whole of what remains permitted and firms
      are working licence-by-licence rather than policy-by-policy. The
      practical risk is not a missed screening hit on the name itself, which
      is unmistakable, but authorised-but-unidentified flows sitting in
      vendor, payroll and benefits systems that no sanctions screen reads. The
      same action day also carried a Burma-related designation removal, and a
      separate release the same day issued a Russia-related general licence;
      both are list maintenance and are not recorded separately.

    required_action: >-
      Ingest the designation and screen the customer, counterparty, vendor,
      payroll and benefits populations for exposure to the Court, not only the
      payment screening population. Read GL 13, 14, 15 and 16 and map each
      identified flow to a specific licence or block it; record which licence
      each permitted flow relies on and its conditions, because outside those
      four authorisations nothing is permitted. Brief legal and HR as well as
      sanctions operations, since pension, telecommunications, software and
      professional-services exposure will not surface through transaction
      screening alone.

    status: open
    supersedes: null

  - id: 2026-10-12-us-002
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_withdrawn
    title: >-
      FinCEN withdraws both outstanding digital asset proposals — the
