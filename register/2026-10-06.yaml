items:

  - id: 2026-10-06-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: rule_final
    title: >-
      FCA opens the cryptoasset authorisation gateway, with applications from
      firms intending to continue UK operations due by 28 February 2027 and the
      regime commencing 25 October 2027
    reference: FCA cryptoasset authorisation gateway
    published: 2026-09-30
    effective: 2027-10-25
    deadline: 2027-02-28
    deadline_type: reporting_date
    source_url: https://www.fca.org.uk/news/press-releases/fca-opens-gateway-regulated-crypto
    verified: 2026-10-06

    entity_scope:
      - crypto_asset_service_providers
    functions_affected:
      - compliance
      - financial_crime
      - legal
      - onboarding
      - board

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      The FCA began accepting authorisation applications from cryptoasset firms
      on 30 September 2026, the first formal authorisation route for UK crypto
      activity. Firms that intend to continue operating in the UK should apply
      by 28 February 2027. The regime commences on 25 October 2027 and the FCA
      expects to decide applications submitted in the window before then;
      firms that applied in time and have no decision by commencement may
      continue operating while under review. Firms that do not meet the
      standards will not be authorised and cannot continue offering regulated
      cryptoasset services in the UK. The dated deadline and the published
      prospect of refusal are what carry the score: this is a
      pre-commencement assessment rather than a registration, so the binding
      event for an applicant is the quality of the submission, not the filing
      date. Second-order effect for banks and EMIs serving the sector: a
      cohort of customers will have a known date on which UK permission ends,
      which is an exit-management question rather than an onboarding one.
      Confirms the 28 February 2027 date that 2026-09-23-uk-001 recorded as
      unconfirmed and kept out of its date fields, and re-confirms the
      30 September 2026 opening and 25 October 2027 commencement stated there.
      Instrument type is recorded as rule_final because the dates attach to a
      regime already made in final form; the artefact itself is the FCA's
      announcement that the gateway is open, not a new rule, and the page
      frames the date as one by which firms intending to continue operating
      should apply. The deadline is recorded as reporting_date because it is
      a submission falling due; the instrument applies on 25 October 2027.
      Continues the thread at 2026-09-23-uk-001.

    required_action: >-
      Cryptoasset firms intending to continue UK operations: confirm the
      application is in train against the 28 February 2027 date, and that the
      business-wide risk assessment, the named MLRO's experience and authority,
      and transaction monitoring tuning and evidence would withstand
      supervisory reading. Firms banking or providing payment rails to the
      sector: record each customer's application status and plan for the
      25 October 2027 commencement date.

    status: open
    supersedes: null

  - id: 2026-10-06-uk-002
    jurisdiction: UK
    regulator: Office of Financial Sanctions Implementation
    regulator_short: OFSI
    instrument_type: guidelines
    title: >-
      OFSI opens the annual frozen asset review, with reports from all persons
      holding or controlling funds of a designated person due by 30 November
      2026
    reference: Annual frozen asset review and reporting form
    published: 2026-09-30
    effective: null
    deadline: 2026-11-30
    deadline_type: reporting_date
    source_url: https://www.gov.uk/government/publications/annual-frozen-asset-review-and-reporting-form
    verified: 2026-10-06

    entity_scope:
      - all_regulated_firms
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - compliance
      - operations
      - finance

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      OFSI updated its annual frozen asset review guidance and reporting form
      on 30 September 2026. All persons that hold or control funds or economic
      resources belonging to a designated person must report, so that HM
      Treasury's records reflect changes over the reporting period. The
      deadline is Monday 30 November 2026. The reporting period itself is set
      out in the guidance notice rather than on the landing page and is not
      recorded here. The review is one of the few scheduled occasions on which
      a firm's sanctions data is tested for accuracy rather than coverage:
      current value, which designation each freeze rests on, and whether that
      designation is still live. That matters more than usual after a year of
      list churn — OFAC alone published a tranche of removals on 5 October
      2026, largely IRAQ2 plus Colombian, Venezuelan and Belarusian entries.

    required_action: >-
      Identify all funds and economic resources held or controlled for
      designated persons, reconcile current values, confirm the designation
      each freeze rests on is still live, and submit the review by
      30 November 2026. Treat discrepancies — frozen assets with no live
      designation behind them, and designated persons whose assets were never
      identified — as findings rather than form-filling.

    status: open
    supersedes: null

  - id: 2026-10-06-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: consultation_paper
    title: >-
      FCA consults on implementation materials and transitional provisions for
      the new transaction reporting regime, closing 6 November 2026, ahead of
      rules taking effect 3 April 2028
    reference: CP26/34
    published: 2026-10-02
    effective: 2028-04-03
    deadline: 2026-11-06
    deadline_type: consultation_close
    source_url: https://www.fca.org.uk/publications/consultation-papers/cp26-34-preparing-new-transaction-reporting-regime
    verified: 2026-10-06

    entity_scope:
      - investment_firms
    functions_affected:
      - compliance
      - operations
      - data
      - technology

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      The FCA published CP26/34 on 2 October 2026, consulting on the materials
      firms need to implement its new transaction reporting rules: guidance on
      the changes, transitional provisions clarifying the shift to the future
      regime, Handbook amendments referencing MAR 13, 14 and 15, and a new
      Transaction Reporting User Pack incorporating existing guidance. It is
      addressed to investment firms, trading venue operators, approved
      reporting mechanisms, trade associations and market participants
      submitting transaction reports, instrument reference data or order book
      data. The consultation closes 6 November 2026 and the new rules take
      effect 3 April 2028. Recorded with the honest caveat that this sits
      outside the register's core financial-crime lane — it is market data and
      reporting, and the 6 October edition treated it as a lookahead calendar
      entry rather than a brief. It is entered as a record so that the
      6 November date reaches the generated calendar, because a deadline held
      only in prose is a deadline that gets missed. Scored 3 on actionability
      because the rules themselves are already made: what is open is the
      implementation detail and the transitional treatment, on which firms are
      expected to be able to evidence a position.

    required_action: >-
      Firms submitting transaction reports, instrument reference data or order
      book data: review the draft guidance, transitional provisions and the
      Transaction Reporting User Pack against current reporting arrangements,
      and respond by 6 November 2026 where the transitional treatment affects
      the implementation plan for 3 April 2028.

    status: open
    supersedes: null

  - id: 2026-10-06-eu-001
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: technical_standard
    title: >-
      AMLA finalises three sets of RTS covering business relationships and
      occasional transactions, customer due diligence, and group-wide
      arrangements, proposed to apply six months after entry into force
    reference: >-
      AMLA final draft RTS — business relationships and occasional
      transactions; customer due diligence; group-wide arrangements
    published: 2026-10-01
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.amla.europa.eu/press-release-amla-finalises-key-standards-private-sector_en
    verified: 2026-10-06

    entity_scope:
      - all_regulated_firms
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - compliance
      - onboarding
      - data
      - board

    scores:
      actionability: 4
      reach: 5

    rationale: >-
      AMLA finalised three sets of regulatory technical standards on 1 October
      2026 and submitted them to the European Commission. The first
      distinguishes business relationships from occasional transactions and
      defines when transactions are linked. The second covers customer due
      diligence: the information that must be collected, the methods for
      verifying it, and politically exposed person screening. The third covers
      group-wide arrangements — governance, risk management, internal controls
      and information sharing. Once the Commission adopts them and they are
      published in the Official Journal, AMLA proposes they apply six months
      after entry into force. Football agents and professional football clubs
      have an extended deadline of 10 July 2029. No adoption or Official
      Journal date has been published, so no effective date or deadline is
      recorded; actionability is scored 4 rather than 5 for that reason, not
      because the obligation is soft. The operative change is definitional:
      a harmonised test for business relationships and linked transactions
      reclassifies a population of customers that currently sits below the
      line and is already onboarded, already transacting, and held in files
      built for the old answer. Six months after entry into force is not a
      remediation window for a back book. The group-wide RTS makes a group
      policy that exists on paper but is not evidenced in subsidiaries a
      supervisory finding rather than an internal audit point.

    required_action: >-
      Identify where the firm currently draws the business-relationship versus
      occasional-transaction line and on what basis, and size the customer
      population that a harmonised linked-transaction test would move across
      it. Review the CDD information and verification standard and the PEP
      screening ruleset against the final draft RTS. For groups, confirm the
      group-wide policy is evidenced in each subsidiary rather than issued to
      it. Track Commission adoption to fix the application date.

    status: open
    supersedes: null

  - id: 2026-10-06-eu-002
    jurisdiction: EU
    regulator: European Securities and Markets Authority
    regulator_short: ESMA
    instrument_type: report
    title: >-
      ESMA asks the Commission for powers to block fraudulent websites, freeze
      assets in suspected market abuse and regulate third-country firms
      soliciting EU investors in its MiCA review response
    reference: ESMA response to the European Commission consultation on the MiCA review
    published: 2026-09-30
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.esma.europa.eu/press-news/esma-news/esma-calls-changes-make-mica-clearer-safer-and-ready-emerging-services
    verified: 2026-10-06

    entity_scope:
      - crypto_asset_service_providers
      - credit_institutions
      - payment_service_providers
    functions_affected:
      - compliance
      - legal
      - financial_crime
      - risk

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      ESMA published its response to the Commission's MiCA review consultation
      on 30 September 2026. Alongside investor-protection asks — stricter
      marketing rules, cost transparency, and proportionate requirements with
      disclosure obligations for staking, lending and borrowing — it asked for
      a different class of tool: capacity to detect and block fraudulent
      websites, to freeze assets where abuse is suspected, and to regulate
      third-country firms soliciting EU investors. It also asked for clearer
      classification criteria for decentralised finance and hybrid tokens and
      for power to issue binding classification opinions, plus burden
      reduction on white papers and duplicate authorisations and a framework
      for tokenised securities and on-chain settlement. Nothing binds yet,
      which fixes actionability at 2. The reason to record it is that it is a
      different request from the EBA's MiCA review priorities recorded in the
      28 September edition: that was about definitions, this is about powers.
      The third-country limb carries the commercial consequence — reverse
      solicitation is how a large share of offshore volume reaches EU
      customers, and ESMA is asking for that to be closed by rule rather than
      argued case by case. Binding classification opinions move AML scope
      decisions out of firms' hands, because classification determines which
      obliged-entity duties attach. Continues the thread at 2026-09-28-eu-004.

    required_action: >-
      No action required. Planning assumption to move: do not build a product
      or distribution model whose viability depends on reverse solicitation
      into the EU, or on a self-determined classification of a hybrid or DeFi
      token.

    status: open
    supersedes: null

  - id: 2026-10-06-eu-003
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: consultation_paper
    title: >-
      AMLA invites expressions of interest by 18 October 2026 for sectoral
      roundtables on simplified customer due diligence, running in Frankfurt
      from 9 November to 2 December 2026
    reference: AMLA sectoral roundtables on simplified customer due diligence
    published: 2026-10-02
    effective: null
    deadline: 2026-10-18
    deadline_type: consultation_close
    source_url: https://www.amla.europa.eu/amla-invites-stakeholders-sectoral-roundtables-simplified-customer-due-diligence_en
    verified: 2026-10-06

    entity_scope:
      - all_regulated_firms
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - compliance
      - onboarding

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      AMLA invited stakeholders on 2 October 2026 to in-person sectoral
      roundtables on simplified customer due diligence in situations
      presenting a lower degree of money laundering and terrorist financing
      risk, to inform its draft Guidelines. Obliged entities, trade
      associations and representative bodies from both the financial and
      non-financial sectors may take part, and AMLA said it particularly
      encourages expressions of interest from the non-financial sector.
      Expressions of interest close on 18 October 2026 at 23:59 CEST; the
      roundtables run in Frankfurt am Main between 9 November and 2 December
      2026. Participation is voluntary, which holds actionability at 2. It is
      recorded because simplified CDD is where proportionality actually lives
      and it is the control most likely to be calibrated on bank evidence and
      then applied to everyone else. The twelve-day expression-of-interest
      window is itself a reason these exercises skew towards large
      institutions. Instrument type is recorded as consultation_paper for the
      taxonomy's sake; the artefact is a roundtable invitation rather than a
      formal consultation document. It is the closest fit in taxonomy.md:
      AMLA is calling for input to inform draft Guidelines, which is what the
      EU column of consultation_paper describes, whereas every other value
      would misstate the artefact as a rule, a statement or a report.

    required_action: >-
      Firms and trade bodies relying materially on simplified CDD, especially
      in the non-financial sector: submit an expression of interest by
      18 October 2026, 23:59 CEST, and prepare the sectoral evidence on
      lower-risk situations that the draft Guidelines would otherwise be
      calibrated without.

    status: open
    supersedes: null

  - id: 2026-10-06-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_proposed
    title: >-
      FinCEN proposes a special measure prohibiting transmittals of funds
      involving six named A7 Network Sub-Agents, with comments closing
      4 November 2026
    reference: >-
      Proposal of special measure prohibiting the transmittal of funds
      regarding transactions involving the A7 Network's Sub-Agents; 91 FR
      document 2026-20371
    published: 2026-10-05
    effective: null
    deadline: 2026-11-04
    deadline_type: consultation_close
    source_url: https://www.federalregister.gov/documents/2026/10/05/2026-20371/proposal-of-special-measure-prohibiting-the-transmittal-of-funds-regarding-transactions-involving
    verified: 2026-10-06

    entity_scope:
      - credit_institutions
      - money_service_businesses
      - payment_service_providers
      - crypto_asset_service_providers
    functions_affected:
      - financial_crime
      - operations
      - compliance
      - technology

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      FinCEN's proposed special measure was published in the Federal Register
      on 5 October 2026, acting under section 9714(a) of the Combating Russian
      Money Laundering Act (Public Law 116-283) as amended by section 6106(b)
      of the National Defense Authorization Act for Fiscal Year 2022 (Public
      Law 117-81). It would prohibit covered financial institutions from
      transmitting funds to or from any A7 Network Sub-Agent, or from or to
      any account or convertible virtual currency address administered by or
      on behalf of one; require institutions to notify affected parties when a
      transmittal is declined; require risk-based screening to identify such
      transactions; and require documentation of compliance with the
      notification requirement. Six Sub-Agents are named: Galadriel Trading
      FZCO, Gimli Trade LLC-FZ, Hydrofusion Resources FZ-LLC, Pearl Bridge,
      Power Sphere LLC-FZ and Sigizmund FZCO. The measure is not in force, so
      actionability is scored 2: under rubric.md a proposed rule is direction
      of travel, and the immediate screening action belongs to the alert
      recorded at 2026-10-06-us-002 rather than to the proposal. That aligns
      it with the SEC custody proposal at 2026-10-06-us-003 and the FTC
      impersonation proposal at 2026-09-28-us-001, both scored 2. The
      planning point is the notification duty, which most payment operations
      have never built as an evidenced workflow. Reach is scored 5 because
      covered financial institutions span banks, money services businesses
      and virtual asset firms rather than one licence category.

    required_action: >-
      Screen for the six named Sub-Agents and any account or convertible
      virtual currency address administered on their behalf. Determine whether
      a declined-transmittal notification workflow exists and is evidenced,
      and whether it could be built to the proposed standard. Consider
      responding by 4 November 2026 on the operational cost of the
      notification and documentation requirements.

    status: open
    supersedes: null

  - id: 2026-10-06-us-002
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: advisory
    title: >-
      FinCEN alert on the A7 Network sets document-based and infrastructure-based
      red flags and a SAR key term, alongside OFAC's designation of the network
      as a significant transnational criminal organisation
    reference: FIN-2026-Alert007
    published: 2026-10-01
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/system/files/2026-10/FinCEN-Alert-A7-Network.pdf
    verified: 2026-10-06

    entity_scope:
      - credit_institutions
      - money_service_businesses
      - payment_service_providers
      - crypto_asset_service_providers
    functions_affected:
      - financial_crime
      - operations
      - technology
      - data

    scores:
      actionability: 3
      reach: 5

    rationale: >-
      FinCEN issued Alert FIN-2026-Alert007 on 1 October 2026, urging
      institutions to detect, identify and report suspicious activity
      involving the A7 Network, which Treasury describes as a shadow banking
      network with ties to Russia used by the Iranian regime to evade
      sanctions. OFAC designated the network as a significant transnational
      criminal organisation. SARs should carry the key term
      "FIN-2026-A7NETWORK" in field 2 and in the narrative. The red flags fall
      into three groups: Sub-Agent usage, including shell companies in the
      Kyrgyz Republic, multi-jurisdictional payment routing, newly formed
      entities with unusual volumes and VPN access from the domains muzpan.com
      and sodkamus.com; invoice falsification, including anomalous shipping
      templates, implausible pricing, analog stamps on digital documents,
      Cyrillic characters in English-language documents and AI-generated
      modifications; and digital asset abuse, including A7A5 token exposure,
      stablecoin transfers to Sub-Agents and stablecoin use for commodity and
      military goods purchases. Named entities include A7 Limited Liability
      Company and subsidiaries A71 LLC and A7 Agent LLC, Promsvyazbank, Old
      Vector LLC, Garantex and Grinex. Jurisdictions named: Russia, Kyrgyz
      Republic, Iran, North Korea, Hong Kong, Indonesia, Seychelles, Türkiye
      and the United Arab Emirates. The structural point, and the reason this
      is recorded separately from the proposed rule: almost none of the red
      flags is name-based. They are document-based and infrastructure-based,
      and two of them — analog stamps on digital documents, AI-modified
      paperwork — are only visible to a person reading the document. Sanctions
      evasion has moved from entities to agency chains, and the control that
      detects an agency chain is competent document review.

    required_action: >-
      Circulate the alert's red flags to trade finance document review,
      payment operations and blockchain analytics, and confirm the three
      groups are reflected in monitoring and in reviewer guidance rather than
      only in name screening. Use the key term FIN-2026-A7NETWORK in field 2
      and in the narrative of any related SAR. Check whether blockchain
      analytics and sanctions screening sit in separate queues with separate
      owners, which is where this typology falls between controls.

    status: open
    supersedes: null

  - id: 2026-10-06-us-003
    jurisdiction: US
    regulator: Securities and Exchange Commission
    regulator_short: SEC
    instrument_type: rule_proposed
    title: >-
      SEC proposes a crypto asset custody framework for investment advisers
      and funds, permitting self-custody in certain conditions and allowing
      state trust companies as custodians
    reference: SEC Release 2026-100
    published: 2026-10-01
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.sec.gov/newsroom/press-releases/2026-100-sec-proposal-would-address-how-investment-advisers-funds-can-custody-crypto-assets-under-federal
    verified: 2026-10-06

    entity_scope:
      - fund_managers
      - investment_firms
    functions_affected:
      - compliance
      - operations
      - risk
      - financial_crime

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      The SEC proposed a framework on 1 October 2026 for how registered
      investment advisers and registered funds may custody crypto assets,
      amending rules under the Investment Advisers Act of 1940 and the
      Investment Company Act of 1940. It would permit self-custody in certain
      conditions and would allow state trust companies to act as custodians,
      and affects registered investment advisers, registered investment
      companies and business development companies. The comment period runs 60
      days from Federal Register publication; the closing date was not stated
      in the release and no date is recorded here. The control consequence is
      the part the framing obscures: a qualified custodian is not only an
      asset-safety arrangement, it is an independent record of holdings and
      the thing an examiner reconciles against. Removing it turns a custody
      rule into a key-management, segregation-of-duties and attestation
      problem in a sector with thin control history in those areas. Where
      custody moves to a state trust company, the AML obligations attaching to
      the custodian depend on how that entity is characterised, against the
      long-unsettled history of the adviser AML programme rule in the US.

    required_action: >-
      No action required. Planning assumption to move: advisers considering
      self-custody should identify what replaces the custodian as the
      independent record of holdings, and who attests to it. Track Federal
      Register publication to fix the comment deadline.

    status: open
    supersedes: null
