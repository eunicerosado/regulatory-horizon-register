# RegWatch register — week ending 2026-10-06
# Converted from the weekly brief. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.
#
# COMPLETE. Every item briefed in the 6 October edition is recorded here,
# scored under rubric.md. Band governs treatment, not whether an item is
# recorded: Low items are held for continuity so that a later item has
# something to move against.

window:
  start: 2026-09-29
  end: 2026-10-06
  coverage: full
  note: >-
    All seven items briefed in the 6 October edition are recorded, as eight
    records: the A7 Network action is split into the proposed special measure
    and the FinCEN alert, because they carry different instrument types and
    different deadlines. A ninth record, FCA CP26/34, was carried by the
