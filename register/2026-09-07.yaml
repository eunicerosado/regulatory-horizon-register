items:

  - id: 2026-09-07-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: advisory
    title: >-
      FinCEN alert puts $12.7bn of suspicious activity on Southeast Asian scam
      centres and introduces the SAR key term FIN-2026-SCAMCENTERS
    reference: FIN-2026-Alert005
    published: 2026-09-03
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-identifies-nearly-13-billion-linked-suspected-digital-asset-scams
    verified: 2026-09-07

    entity_scope:
      - credit_institutions
      - money_service_businesses
      - crypto_asset_service_providers
    functions_affected:
      - financial_crime
      - operations
      - data

    scores:
      actionability: 3
      reach: 5

    rationale: >-
      Alert and supporting financial trend analysis on laundering tied to
      digital asset investment scam centres run largely from Southeast Asia:
      approximately $12.7bn in suspicious activity across 33,904 BSA reports
      filed between 8 September 2023 and 31 December 2025, with victims in all
      50 states and US territories. Three red-flag sets - victim payments,
      guarantee marketplaces, and laundering techniques. Institutions are asked
      to reference FIN-2026-SCAMCENTERS in SAR field 2 and the narrative, and to
      select Fraud-Other in field 34(z) with the description "Scam Centers." The
      filing mechanics are the easy part. Guarantee marketplaces - escrow
      services through which scam operators buy laundering, data and
      infrastructure from each other - describe a supply chain rather than a
      typology, so the entity monitoring flags is often several steps from the
      fraud. Six days later OFAC designated the largest of them, Xinbi
      Guarantee (2026-09-14-us-003). Once a key term exists, the volume and
      quality of filings against it becomes something a supervisor can measure.

    required_action: >-
      Add the key term and field 34(z) instruction to SAR procedures and case
      management. Map the three red-flag sets to existing scenarios and record
      where none applies. Confirm fraud and AML teams reconcile scam cases, so
      that a quarter with no filings under the key term reflects no exposure
      rather than two teams not talking.

    status: open
    supersedes: null

  - id: 2026-09-07-us-002
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_final
    title: >-
      FinCEN reissues the southwest border geographic targeting order, cutting
      the MSB cash reporting threshold to $1,000 in eight counties
    reference: Geographic Targeting Order, Federal Register doc. 2026-18194
    published: 2026-09-02
    effective: 2026-09-04
    deadline: 2027-03-03
    deadline_type: expiry
    source_url: https://www.fincen.gov/news/news-releases/fincen-reissues-order-requiring-transparency-msbs-along-southwest-border
    verified: 2026-09-07

    entity_scope:
      - money_service_businesses
      - credit_institutions
    functions_affected:
      - financial_crime
      - operations
      - onboarding

    scores:
      actionability: 5
      reach: 2

    rationale: >-
      A geographic targeting order rather than a rule - recorded as rule_final
      because it is a binding obligation with dates, which is what the label
      needs to convey here. Certain MSBs must file Currency Transaction Reports
      for cash transactions between $1,000 and $10,000 in specified ZIP codes of
      Bernalillo, Dona Ana and San Juan counties, New Mexico, and Cameron, El
      Paso, Hidalgo, Maverick and Webb counties, Texas. It runs for 180 days
      after Federal Register publication on 4 September 2026; the expiry
      recorded here is computed from that, not stated by FinCEN. The load falls
      hardest on the smallest firms - agents filing at a tenth of the usual
      threshold, often manually. The read-across for banks is the useful part:
      an MSB customer operating in these counties whose CTR volume does not
      rise this quarter is either not complying or not disclosing where it
      operates, which makes the order a free control test.

    required_action: >-
      MSBs in the named ZIP codes: confirm reporting at the $1,000 threshold is
      live, including at agent locations. Banks with MSB customers: identify
      which operate in the covered counties and add an expected rise in CTR
      volume to this quarter's reviews.

    status: open
    supersedes: null

  - id: 2026-09-07-us-003
    jurisdiction: US
    regulator: Federal Trade Commission
    regulator_short: FTC
    instrument_type: enforcement
    title: >-
      FTC settlement makes Nuvei pay $4.85m and names load balancing across
      merchant accounts as evasion of fraud monitoring
    reference: null
    published: 2026-09-04
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ftc.gov/news-events/news/press-releases/2026/09/payment-processor-nuvei-must-implement-robust-merchant-screening-practices-pay-485-million-settle
    verified: 2026-09-07

    entity_scope:
      - payment_service_providers
      - credit_institutions
    functions_affected:
      - financial_crime
      - onboarding
      - risk

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      Settlement with Nuvei Corporation and four affiliates on a 2-0 Commission
      vote. The FTC alleged Nuvei knowingly opened and kept processing accounts
      for deceptive merchants, including over $30m processed between 2017 and
      2023 for Reimage, an offshore tech-support scam, charged under the FTC Act
      and the Telemarketing Sales Rule. Nuvei pays $4.85m and is banned from
      processing tech-support sales made by telemarketing or pop-up; must run
      enhanced screening of existing clients whose chargeback rates exceed set
      limits and monitor high-risk categories such as outbound telemarketing;
      and must not use tactics to evade bank or card-network fraud monitoring,
      "including load balancing." Naming load balancing reframes a long-open
      commercial practice as evasion of a control. If chargeback ratios are
      managed rather than measured, every downstream control that consumes them
      - merchant risk scoring, review triggers, sponsor bank oversight - runs
      on a shaped number. Four days later the FTC moved against Humboldt
      Merchant Services on the same pattern (2026-09-14-us-004); two actions in
      one week is a direction, not an incident.

    required_action: >-
      Establish whether any merchant's volume is split across multiple MIDs
      and whether chargeback ratios can be viewed across a single beneficial
      owner. Confirm existing merchants are re-screened, not only new ones, and
      whether high-risk merchant approval sits with someone carrying a revenue
      target.

    status: open
    supersedes: null

  - id: 2026-09-07-us-004
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: supervisory_statement
    title: >-
      FinCEN and the federal banking agencies state that SAR confidentiality
      does not stop banks warning customers about suspected fraud or explaining
      account closures
    reference: null
    published: 2026-09-02
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-agencies-issue-joint-statement-suspicious-activity-report-confidentiality
    verified: 2026-09-07

    entity_scope:
      - credit_institutions
    functions_affected:
      - compliance
      - operations
      - financial_crime

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      Joint statement by FinCEN, the FRB, FDIC, NCUA and OCC that SAR
      confidentiality requirements "do not preclude banks from communicating
      with their customers regarding potentially fraudulent transactions and
      other suspicious activity or account closures." The agencies state it
      "does not alter existing Bank Secrecy Act (BSA) legal or regulatory
      requirements or establish new supervisory expectations" - hence
      actionability 2. Nothing changed legally, and that is the point: "we
      can't tell you, it's a SAR" has served as a catch-all script in contact
      centres and closure letters, and regulators have now removed that cover
      in writing, turning an ambiguity into a training and conduct question.
      The second-order effect is on scam victims - a bank that could have said
      "this transfer looks like a scam" and said nothing has a weaker position
      with a supervisor and in any redress forum. Expect the statement to be
      cited back at firms more often than by them.

    required_action: >-
      Review fraud call scripts and account-closure templates for refusals
      justified on confidentiality grounds, and test each against what the rule
      actually protects. Confirm who owns those scripts, since the failure will
      occur in customer-facing teams rather than in financial crime.

    status: open
    supersedes: null

  - id: 2026-09-07-uk-001
    jurisdiction: UK
    regulator: Office of Financial Sanctions Implementation
    regulator_short: OFSI
    instrument_type: enforcement
    title: >-
      OFSI imposes a £4.73m penalty on Citibank's London branch for making
      funds available for the benefit of a designated person, under two regimes
    reference: s.146 Policing and Crime Act 2017
    published: 2026-09-02
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.gov.uk/government/publications/imposition-of-monetary-penalty-citibank-na-london-branch
    verified: 2026-09-07

    entity_scope:
      - credit_institutions
    functions_affected:
      - financial_crime
      - compliance
      - technology

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      Penalty of £4,732,830.58 imposed on 11 August 2026 and published 2
      September. OFSI's enforcement collection records the breach as "making
      funds available for the benefit of a designated person" under the Russia
      (Sanctions) (EU Exit) Regulations 2019 and the Global Anti-Corruption
      Sanctions Regulations 2021. The penalty notice itself could not be read
      when this record was compiled, so transaction values, conduct dates,
      voluntary disclosure and any discount are not asserted here. Against
      OFSI's other published 2026 penalties - £1,000,920.59, £390,000,
      £165,000 and £160,000 - this is a step change. Two details carry the
      lesson. "For the benefit of" is a wider hook than "to", reaching indirect
      benefit through structures, which is closer to ownership and control
      analysis than to name screening. And pairing Russia with Global
      Anti-Corruption in one action suggests the thematic regimes that were not
      resourced after 2022 are where findings now come from.

    required_action: >-
      Read the penalty notice before briefing a board; this record is built
      from the publication and collection pages only. Test whether screening
      can detect indirect benefit to a designated person, not only a name in a
      payment field. Check the resourcing and tuning given to the smaller
      thematic regimes against the Russia programme.

    status: open
    supersedes: null

  - id: 2026-09-07-eu-001
    jurisdiction: EU
    regulator: Council of the European Union
    regulator_short: Council
    instrument_type: legislation
    title: >-
      EU customs reform adopted - the sub-EUR 150 duty exemption goes,
      non-EU e-commerce platforms become the importer, and a single customs
      data hub is created
    reference: null
    published: 2026-09-03
    effective: null
    deadline: 2026-11-01
    deadline_type: application_date
    source_url: https://www.consilium.europa.eu/en/press/press-releases/2026/09/03/eu-customs-council-greenlights-landmark-reform/
    verified: 2026-09-07

    entity_scope:
      - credit_institutions
      - payment_service_providers
    functions_affected:
      - financial_crime
      - risk

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      Final Council approval of the customs overhaul. It creates an EU Customs
      Authority in Lille, operating from 2027, and an EU Customs Data Hub that
      will risk-score consignments. The duty exemption for imports under EUR
      150 is removed and an EU-wide handling fee on small parcels is to be
      introduced by 1 November 2026 - the deadline field records that date,
      which the Council gives as "by". Non-EU e-commerce platforms are treated
      as the importer and made responsible for customs compliance, with
      penalties of up to 6% of annual import value. Hub use becomes mandatory
      for e-commerce businesses from 1 July 2028 and for all traders from 1
      March 2034. The direct obligations fall on platforms and importers, a
      population outside the register's usual perimeter; the entity scope
      records the financial firms that feel it. For them this is a financial
      crime item: undervaluation of low-value consignments has been a durable
      trade-based laundering and duty-fraud technique precisely because
      sub-EUR 150 parcels attracted no duty and little scrutiny. The hub will
      eventually give trade-based money laundering controls a dataset they have
      always treated as unobtainable, and a penalty expressed as a percentage
      of import value changes the risk profile of marketplace clients.

    required_action: >-
      Identify marketplace, platform and cross-border e-commerce clients that
      will become the importer of record, and reassess their exposure given
      penalties scaled to import value. Note the hub dates in trade-based money
      laundering planning.

    status: open
    supersedes: null
