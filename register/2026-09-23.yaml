items:

  - id: 2026-09-23-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: rule_final
    title: >-
      FCA cryptoasset authorisation gateway opens on 30 September 2026, with the
      regime coming into force on 25 October 2027 and existing registrations not
      converting automatically
    reference: PS26/18 Cryptoasset Perimeter Guidance
    published: 2026-09-16
    effective: 2027-10-25
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/crypto-firms-get-guidance-how-new-regime-applies
    verified: 2026-09-29

    entity_scope:
      - crypto_asset_service_providers
      - e_money_institutions
      - payment_service_providers
    functions_affected:
      - compliance
      - legal
      - financial_crime

    scores:
      actionability: 4
      reach: 4

    rationale: >-
      Final perimeter guidance on which cryptoasset activities require
      authorisation. The press release states that the authorisation gateway
      for firms will open on 30 September 2026 and that the regime comes into
      force on 25 October 2027. The load-bearing point for firms already
      registered under the Money Laundering Regulations is that an MLR
      registration is a financial crime supervision status while the new
      permissions are conduct authorisations, with threshold conditions, a
      business model to defend and a senior management regime attached. Firms
      already authorised as e-money issuers or payment institutions may need a
      variation of permission rather than a fresh application, which changes
      the timetable. DATE UNCONFIRMED - the 23 September edition also recorded
      28 February 2027 as a transitional-route application deadline, sourced to
      PS26/18. That date does not appear in this press release and was not
      re-verified on 29 September 2026, so it is deliberately not recorded in
      any date field here. It should be confirmed against PS26/18 itself before
      being relied on, because if correct it is the operative deadline rather
      than October 2027.

    required_action: >-
      Map current activities to the five authorisation buckets and determine
      whether a new authorisation or a variation of permission is required.
      Confirm the transitional-route deadline against PS26/18 directly and put
      that date, not the October 2027 commencement, in front of the board.

    status: open
    supersedes: null

  - id: 2026-09-23-uk-002
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: supervisory_statement
    title: >-
      Defence Against Money Laundering SAR threshold raised to £3,000, removing a
      tranche of low-value consent requests and leaving the judgment with the firm
    reference: null
    published: 2026-09-17
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/speeches/financial-crime-protecting-hive
    verified: 2026-09-29

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - compliance
      - operations

    scores:
      actionability: 4
      reach: 5

    rationale: >-
      Stated in a speech by the FCA's Executive Director of Enforcement and
      Market Oversight at the Law Society Economic Crime Conference. The speech
      records the threshold as raised to £3,000, producing fewer low-value
      reports and more capacity to focus on higher-risk activity. Recorded as a
      supervisory statement because the change was announced in a speech rather
      than in a published instrument; no commencement date is given and none is
      recorded here. The consequence for firms is not volume relief but the
      transfer of a judgment. Below the threshold the consent request is no
      longer available as a statutory defence, so the transaction still needs a
      decision, the suspicion still needs handling, and the firm owns the
      outcome. Fewer reports means each remaining decision carries more weight.

    required_action: >-
      Re-paper the internal escalation standard for suspicions falling below the
      threshold, so that the judgment the consent request used to substitute for
      is documented and owned. Confirm the commencement of the change with the
      relevant published source before relying on the threshold operationally.

    status: open
    supersedes: null

  - id: 2026-09-23-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: supervisory_statement
    title: >-
      FCA to take on AML supervision of 60,000 legal and accounting sector
      entities from the back end of 2028
    reference: null
    published: 2026-09-17
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/speeches/financial-crime-protecting-hive
    verified: 2026-09-29

    entity_scope:
      - designated_non_financial_businesses
    functions_affected:
      - compliance
      - financial_crime
      - legal

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      The same speech states that the FCA will begin to take on responsibility
      for AML supervision of 60,000 entities in the legal and accounting sectors
      at the back end of 2028, using a risk-based, intelligence-led approach. No
      month is stated, so no date is recorded in the effective field. This
      consolidates professional-body supervision into a statutory regulator with
      enforcement powers and a data operation, which addresses the most
      criticised gap in the UK AML regime. Direction of travel for now, hence
      actionability 2, but it changes who correspondent and client-account
      relationships with law firms and accountancy practices ultimately answer
      to, which is a planning assumption worth moving early.

    required_action: >-
      Firms banking or servicing legal and accountancy practices should note the
      supervisory transfer in their sector risk assessment and watch for the
      implementing instrument, which had not been published as at 29 September
      2026.

    status: open
    supersedes: null

  - id: 2026-09-23-eu-001
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: guidelines
    title: >-
      EBA final Guidelines on the management of third-party risk bring non-ICT
      providers into the same framework as ICT ones, with a two-year transitional
      period
    reference: null
    published: 2026-09-18
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.eba.europa.eu/publications-and-media/press-releases/eba-publishes-its-final-guidelines-management-third-party-risk-delivering-more-proportionate-and
    verified: 2026-09-29

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - investment_firms
      - crypto_asset_service_providers
    functions_affected:
      - risk
      - operations
      - compliance
      - legal

    scores:
      actionability: 4
      reach: 5

    rationale: >-
      Final Guidelines covering the full lifecycle of a third-party arrangement:
      risk assessment and due diligence, contracting, subcontracting, monitoring,
      documentation and exit strategies. They promote a holistic approach across
      ICT and non-ICT services and are scoped to arrangements supporting critical
      or important functions, where disruption would materially impair the
      performance of the financial entity. DORA already covers ICT third parties;
      the significant part here is that non-ICT providers come into the same
      framework, which for a financial crime function means the outsourced KYC
      bureau, the offshore alert-review team and the CDD remediation vendor move
      from a procurement folder into a resilience register. The proportionality
      cuts both ways: scoping by critical-or-important function means the first
      supervisory question becomes why a given arrangement is not critical.
      DATE UNCONFIRMED - the press release states a two-year transitional period
      but does not give a date of application, so no date is recorded here and
      none should be inferred from the transitional period alone.

    required_action: >-
      Identify third-party arrangements supporting critical or important
      functions, including non-ICT arrangements in the financial crime chain, and
      be able to evidence the basis on which arrangements were not so designated.
      Confirm the date of application from the Guidelines themselves when
      published in final form.

    status: open
    supersedes: null

  - id: 2026-09-23-eu-002
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: consultation_paper
    title: >-
      AMLA consultation on draft RTS on assessing the inherent and residual risk
      profile of obliged entities in the non-financial sector, closed 27 September
    reference: null
    published: 2026-07-13
    effective: null
    deadline: 2026-09-27
    deadline_type: consultation_close
    source_url: https://www.amla.europa.eu/policy/public-consultations
    verified: 2026-09-29

    entity_scope:
      - designated_non_financial_businesses
    functions_affected:
      - compliance
      - financial_crime
      - risk

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      Consultation on draft Regulatory Technical Standards governing how
      supervisors assess the inherent and residual risk profile of obliged
      entities in the non-financial sector. Opened 13 July 2026 and closed 27
      September 2026 at 23:59 CEST, both re-read on the AMLA consultations page
      on 29 September 2026. Recorded as closed. It is kept in the register rather
      than dropped because the resulting standards determine how non-financial
      obliged entities will be risk-rated by their supervisors, and the draft is
      the best available indication of the methodology ahead of the final text.

    required_action: >-
      The window to respond has passed. Non-financial obliged entities and their
      advisers should read the draft as the working indication of supervisory
      risk-rating methodology and watch for the final RTS.

    status: closed
    supersedes: null
