      Consultation on draft Regulatory Technical Standards on cross-border
      information exchange between Financial Intelligence Units. Opened 6 July;
      closes 6 October 2026 at 23:59 CEST. Recorded this week, although
      published earlier, because the close falls inside the 60-day calendar;
