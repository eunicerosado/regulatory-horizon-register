  - id: 2026-09-28-uk-002
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: report
    title: >-
      FCA survey of 35 firms records 238,396 suspected money mule accounts
      closed in 2025 and says firms need to do more on early detection
    reference: null
    published: 2026-09-23
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/firms-crack-down-money-mules-need-do-more
    verified: 2026-09-29

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - e_money_institutions
    functions_affected:
      - financial_crime
      - operations
      - compliance

    scores:
      actionability: 3
      reach: 5

    rationale: >-
      Survey of 35 financial institutions. Suspected mule accounts closed rose
      from 184,935 in 2023 to 233,269 in 2024 and 238,396 in 2025. Closures were
      highest among customers aged 26-39 at 91,073 and grew fastest in the 40-49
      group, 37,274 in 2025 against 25,760 in 2024; customers aged 25 and under
      accounted for 85,425. The operative finding is not the volume but the
      statement that criminals move funds through multiple accounts before
      cashing out, typically between the second and fifth account. A detection
      programme concentrated on the first receiving account is working the layer
      the criminal expects to lose, while the accounts two to five hops out
      present as ordinary customers receiving ordinary sterling transfers from
      ordinary UK banks. That is a monitoring design question rather than a
      tuning one. Actionability 3 because no rule changed and no date attaches,
      but the FCA has stated an expectation firms must be able to evidence a
      position against. The FCA describes working with the National Crime
      Agency, the Home Office and HM Treasury on intelligence sharing, and a
      public-private working cell established with 22 regulated firms in 2025.

    required_action: >-
      Establish where in the chain your mule closures actually sit. If they
      cluster at the first receiving account, the closure count measures effort
      rather than effectiveness. Review whether monitoring can see an account
      whose inbound is almost entirely from other UK current accounts, held
      briefly and paid out fast, and review what is passed to the next firm at
      the point of closure.

    status: open
    supersedes: null

  - id: 2026-09-28-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      Twenty-one CFD firms closed since 2025 and three cancelling permissions,
      after the FCA found UK authorisation used as a badge for linked overseas
      companies
    reference: null
    published: 2026-09-25
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/twenty-four-cfd-firms-closing-crackdown-misuse-uk-authorisation
    verified: 2026-09-29

    entity_scope:
      - investment_firms
    functions_affected:
      - compliance
      - legal
      - risk

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      Recorded as enforcement, though the published action is a mix of
      supervisory and enforcement measures rather than a single Final Notice:
      trading restrictions at some firms, required independent business reviews,
      and two enforcement investigations in the most serious cases. The FCA found
      firms doing minimal UK business that used their UK authorisation, in the
      FCA's words, as a badge to make linked overseas companies look more
      trustworthy than they really are, leaving consumers believing they held UK
      protections that did not apply. This is a perimeter case rather than a
      conduct case, and the structure it lands on is common well beyond CFDs:
      payments, crypto, wealth and brokerage groups routinely hold one UK
      permission while serving most clients through offshore affiliates. Reach 3
      rather than 4 because the exposure follows a business model rather than a
      licence category. The consequence for third parties is that an FCA
      authorisation stops answering a diligence question and starts one:
      authorised for what, at what volume, with whom sharing the name.

    required_action: >-
      Groups holding a UK authorisation alongside non-UK affiliates that share a
      brand, website or client-acquisition funnel should be able to evidence how
      the authorisation is presented to consumers, and should expect group
      structure to be treated as a supervisory artefact. Firms providing accounts
      or services to such groups should stop treating authorised status as a
      diligence answer.

    status: open
    supersedes: null

  - id: 2026-09-28-eu-004
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: report
    title: >-
      EBA sets out four priorities for the Commission's MiCA review, led by
      multi-issuer stablecoin schemes involving third-country issuers
    reference: null
    published: 2026-09-24
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.eba.europa.eu/publications-and-media/press-releases/eba-identifies-priorities-review-mica
    verified: 2026-09-29

    entity_scope:
      - crypto_asset_service_providers
      - credit_institutions
      - e_money_institutions
    functions_affected:
      - risk
      - compliance
      - legal
      - financial_crime

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      Four priorities put to the European Commission ahead of its review of the
      Markets in Crypto-Assets Regulation: strengthening the framework for
      multi-issuer stablecoin schemes involving third-country issuers, which the
      EBA describes as carrying significant to very significant risks, together
      with a review of reserve requirements; clarifying scope and definitions,
      where classification difficulties create avoidable costs and delays in
      product roll-out; regulating crypto-asset lending, particularly where
      providers facilitate access to decentralised finance protocols; and
      strengthening the reporting framework for issuers and crypto-asset service
      providers. Actionability 2 because this is advice toward a future review
      rather than a change, but the planning assumptions move now. The
      multi-issuer point is the one with money attached: where the same token is
      issued inside and outside the EU, the EU-regulated leg carries the
      redemption promise while part of the reserve and the issuance discipline
      sit under another regime. The lending priority closes a perimeter argument
      several CASPs have built product on, namely that facilitating access to
      DeFi is non-custodial and therefore out of scope. The EBA frames none of
      this as AML, but classification determines which obliged-entity
      obligations attach, so the financial crime consequence arrives second.

    required_action: >-
      Issuers operating a scheme with a non-EU co-issuer, and CASPs offering
      lending, yield or routed access to DeFi, should establish now which leg of
      the structure would be answerable in the EU under each priority, rather
      than after the review reports.

    status: open
    supersedes: null

  - id: 2026-09-28-us-002
    jurisdiction: US
    regulator: Securities and Exchange Commission
    regulator_short: SEC
    instrument_type: enforcement
    title: >-
      SEC censures OTC Link LLC and imposes a $575,000 penalty for nine years of
      unremediated Regulation SCI policy failures identified across multiple
      examinations
    reference: Regulation SCI Rules 1001(a)(1), 1001(a)(2), 1001(a)(3)
    published: 2026-09-22
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.sec.gov/newsroom/press-releases/2026-91-sec-censures-otc-link-llc-repeated-compliance-failures-related-regulation-sci
    verified: 2026-09-29

    entity_scope:
      - investment_firms
    functions_affected:
      - compliance
      - technology
      - risk

    scores:
      actionability: 1
      reach: 2

    rationale: >-
      Censure and a $575,000 civil penalty for failing to establish, maintain and
      enforce written policies and procedures required by Regulation SCI between
      August 2016 and March 2025, covering system security, access control and
      application vulnerability management for the firm's alternative trading
      system. Scored 1 for actionability under the rubric because it is an
      enforcement outcome imposing no new obligation, and 2 for reach because SCI
      entities are a narrow population. Recorded for continuity rather than
      briefed, because the transferable point only becomes visible if a second
      action lands on the same root cause. That point is that the conduct priced
      here is not the control gap but the nine-year failure to close it after
      examiners identified it: the SEC said the repeated failure to address
      deficiencies showed a disregard for their findings and the overall
      examinations process. That converts a technology deficiency into a
      governance finding, and the read-across for any regulated firm is the age
      of the oldest item on its own remediation log.

    required_action: >-
      None arising directly. Firms outside the SCI population may wish to
      establish how many examination cycles their oldest open finding has
      survived, since that is the fact the SEC priced here.

    status: open
    supersedes: null
