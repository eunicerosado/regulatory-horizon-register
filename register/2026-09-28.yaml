items:

  - id: 2026-09-28-uk-001
    jurisdiction: UK
    regulator: Foreign, Commonwealth and Development Office
    regulator_short: FCDO
    instrument_type: legislation
    title: >-
      Iran (Sanctions) (Amendment) Regulations 2026 take effect on 29
      September, adding sectoral trade bans and financial, investment and
      brokering prohibitions that reach indirect and third-country activity
    reference: Iran (Sanctions) (Amendment) Regulations 2026
    published: 2026-09-08
    effective: 2026-09-29
    deadline: null
    deadline_type: null
    source_url: https://www.gov.uk/government/publications/notice-to-exporters-202618-iran-sanctions-amendments-effective-from-29-september-2026/nte-202618-iran-sanctions-amendments-effective-from-29-september-2026
    verified: 2026-09-29

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - compliance
      - operations

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      Amends the Iran (Sanctions) (Nuclear) (EU Exit) Regulations 2019 and the
      Iran (Sanctions) Regulations 2023. New trade prohibitions cover energy,
      precious metals, maritime technology, natural gas, oil products,
      petrochemicals and sectoral software. New financial restrictions cover
      loans, credit, investment, banking relationships and dealings in Iranian
      sovereign bonds, and the financial services and brokering prohibitions
      extend to indirect and third-country activity. Published by Notice to
      Exporters 2026/18. The indirect and third-country reach is the
      perimeter point: exposure is not limited to payments that touch Iran on
      their face, so trade finance and correspondent books need reviewing for
      the new sectors rather than only screening for names. Continues the
      thread at 2026-09-14-uk-001.

    required_action: >-
      Confirm screening, trade finance and correspondent banking controls
      reflect the new sectoral prohibitions and the financial restrictions from
      29 September 2026, including brokering and indirect or third-country
      activity. Review existing loans, credit, investment and banking
      relationships and any holdings of or dealings in Iranian sovereign bonds.

    status: open
    supersedes: null

  - id: 2026-09-28-eu-003
    jurisdiction: EU
    regulator: Council of the European Union
    regulator_short: Council
    instrument_type: sanctions_action
    title: >-
      Council prolongs the Ukraine territorial-integrity listings for three
      years, to 22 September 2029, covering more than 3,000 persons and
      entities
    reference: Council Decision 2014/145/CFSP; Council Regulation (EU) No 269/2014
    published: 2026-09-22
    effective: null
    deadline: 2029-09-22
    deadline_type: expiry
    source_url: https://www.consilium.europa.eu/en/press/press-releases/2026/09/22/ukraine-s-territorial-integrity-eu-extends-individual-listings-for-further-three-years/
    verified: 2026-09-28

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - operations
      - legal

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      The restrictive measures against those undermining Ukraine's territorial
      integrity, sovereignty and independence are prolonged for three years,
      with a new expiry of 22 September 2029, recorded in the deadline field
      as an expiry. They cover more than 3,000 individuals and entities and
      comprise travel restrictions, asset freezes and a prohibition on making
      funds or economic resources available. In the course of the renewal the
      Council removed three deceased persons and discontinued the listings of
      three individuals and one entity. The release does not state the
      previous renewal period, so the change to note is the three-year
      horizon itself: the Council's renewal date no longer prompts a periodic
      re-check of these screening records, and that refresh now depends on the
      firm's own review calendar. The delistings arrive as an amendment inside
      the renewal rather than as a new tranche.

    required_action: >-
      Confirm the delistings made in this renewal have been applied to
      screening lists and frozen-asset records. Check that internal periodic
      review of these listings does not rely on the Council's renewal date.

    status: open
    supersedes: null

  - id: 2026-09-28-us-001
    jurisdiction: US
    regulator: Federal Trade Commission
    regulator_short: FTC
    instrument_type: consultation_paper
    title: >-
      FTC asks whether to update the Impersonation Rule to address platforms'
      role in promoting impersonation scams - comment deadline not yet
      confirmed
    reference: Rule on Impersonation of Government and Businesses
    published: 2026-09-24
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ftc.gov/news-events/news/press-releases/2026/09/ftc-seeks-public-comment-whether-update-rule-impersonation-government-businesses-address-platforms
    verified: 2026-09-28

    entity_scope:
      - credit_institutions
      - payment_service_providers
      - e_money_institutions
    functions_affected:
      - financial_crime
      - operations
      - compliance

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      Advance notice of proposed rulemaking asking whether to update the Rule
      on Impersonation of Government and Businesses, or take other action, to
      address how digital platforms' advertising optimisation practices help
      scammers impersonate legitimate businesses and government agencies. The
      FTC cites nearly $3.5 billion in reported impersonation losses in 2025,
      more than one million imposter scam reports, $2.1 billion in
      social-media-related losses and around 30% of victims first contacted on
      social media. DATE UNCONFIRMED - comments are due 60 days after
      publication in the Federal Register, and that publication date has not
      been confirmed, so the deadline field is deliberately left empty and
      this item will not appear in the deadline calendar until it is set.
      Existing fraud liability regimes put the duty on the institution nearest
      the money; this asks whether the party that sold the reach should carry
      some of it, which is why it is recorded for banks and payment firms
      rather than platforms.

    required_action: >-
      Monitor for Federal Register publication and set the comment deadline
      when confirmed. Firms whose brand is impersonated in paid search and
      social ads should consider whether to put their own impersonation data
      on the record in a comment.

    status: open
    supersedes: null

  - id: 2026-09-28-eu-002
    jurisdiction: EU
    regulator: European Securities and Markets Authority
    regulator_short: ESMA
    instrument_type: supervisory_statement
    title: >-
      ESMA sets a Union Strategic Supervisory Priority on digital innovation
      from 2027, covering how supervised firms deploy AI and tokenisation
    reference: null
    published: 2026-09-23
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.esma.europa.eu/press-news/esma-news/esma-sets-new-supervisory-priority-digital-innovation-2027
    verified: 2026-09-28

    entity_scope:
      - investment_firms
      - fund_managers
      - crypto_asset_service_providers
    functions_affected:
      - risk
      - technology
      - compliance

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      A new Union Strategic Supervisory Priority on digital innovation, to run
      from 2027 - month not yet stated, so no date is recorded in the
      effective field - covering how supervised entities deploy artificial
      intelligence and tokenisation, delivered jointly with national competent
      authorities. ESMA's stated aim is to ensure supervisors have the
      expertise and capacity to oversee the use of new technologies. A Union
      Strategic Supervisory Priority means national supervisors ask the same
      questions in the same period, so the questions are being written now.
      Because the stated constraint is supervisory capability, the first
      examinations are likely to test what can be assessed in a meeting -
      documentation, explainability and human oversight - rather than model
      performance. Direction of travel, hence actionability 2.

    required_action: >-
      Inventory AI and tokenisation use cases in scope, including AI components
      in financial crime monitoring, screening and KYC, and confirm each has a
      documented purpose, a named owner and evidence of human oversight before
      2027.

    status: open
    supersedes: null

  - id: 2026-09-28-eu-001
    jurisdiction: EU
    regulator: Anti-Money Laundering Authority
    regulator_short: AMLA
    instrument_type: consultation_paper
    title: >-
      AMLA consults on draft RTS on cross-border information exchange between
      Financial Intelligence Units, closing 6 October
    reference: null
    published: 2026-07-06
    effective: null
    deadline: 2026-10-06
    deadline_type: consultation_close
    source_url: https://www.amla.europa.eu/policy/public-consultations
    verified: 2026-09-29

    entity_scope:
      - all_regulated_firms
    functions_affected:
      - financial_crime
      - operations
      - technology

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      Consultation on draft Regulatory Technical Standards on cross-border
      information exchange between Financial Intelligence Units. Opened 6 July;
      closes 6 October 2026 at 23:59 CEST. Recorded this week, although
      published earlier, because the close falls inside the 60-day calendar;
      it was the only AMLA consultation still open as at the 28 September
      edition. The standards govern exchange between FIUs rather than
      reporting by firms, so the population with most at stake is firms filing
      into more than one national FIU, whose reports may travel between them.

    required_action: >-
      Respond by 6 October 2026, 23:59 CEST, if at all. MLROs and SAR teams
      filing into more than one FIU should read the draft for how their
      reports would be shared.

    status: open
    supersedes: null
