# RegWatch register, week ending 2026-10-19
# Backfilled on 2026-11-07. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.

window:
  start: 2026-10-12
  end: 2026-10-19
  coverage: partial
  note: >-
    Backfill, begun 2026-11-07 and completed 2026-11-07. The week of 19 October 2026
    produced a RegWatch edition but never a register file, so its dated items never
    reached the calendar. This file supersedes the single-record version committed
    earlier the same day: record eu-001 is unchanged and three records are added.
    Every source was re-read on 2026-11-07 and `verified` is set to that date, not to
    the original window. Two corrections to the edition's prose are captured in the
    rationales rather than carried across. First, the edition described eu-001's split
    of supervisory responsibilities as closed, where the EBA's page introduces the
    retained list with "such as". Second, the edition labelled EBA/CP/2026/17 as RTS on
    prudential requirements for investment firms; the EBA's own consultation page carries
    that title while the attached consultation paper is titled draft RTS on
    reclassification of investment firms as credit institutions, and the discrepancy is
    on the source, so both titles are recorded and neither is resolved here. Still not
    recorded, because the register has no value for a scheduled court date: see uk-001,
    where the 10 December 2026 sentencing sits in the rationale with `deadline: null`
    rather than being forced onto a deadline type that does not fit. The EU T+1 go-live
    of 11 October 2027 is not given its own record; it is noted in eu-003, whose
    requirements are the dated step toward it, and ESMA's page names no instrument for
    the go-live date itself.

items:
  - id: 2026-10-19-eu-001
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: supervisory_statement
    title: >-
      EBA classifies USDC as the first significant e-money token under MiCA, moving
      reserve, own funds and liquidity supervision from ACPR to the EBA on 12 November 2026
    reference: Commission Delegated Regulation (EU) 2024/1506; MiCA significant EMT classification
    published: 2026-10-14
    effective: 2026-11-12
    deadline: 2026-11-12
    deadline_type: application_date
    source_url: https://www.eba.europa.eu/publications-and-media/press-releases/eba-classifies-usdc-first-significant-e-money-token-european-union
    verified: 2026-11-07

    entity_scope: [crypto_asset_service_providers, e_money_institutions, payment_service_providers, credit_institutions]
    functions_affected: [compliance, financial_crime, risk, finance, operations]

    scores:
      actionability: 4
      reach: 4

    rationale: >-
      The EBA classified USDC, issued in the EU by Circle Internet Financial Europe SAS,
      as a significant e-money token under MiCA, the first of the 45 e-money tokens
      notified in the EU to be classified significant. Dual supervision for significant
      EMTs applies from 12 November 2026: direct supervision of own funds, the reserve of
      assets, liquidity requirements and recovery and redemption plans moves from the
      French regulator ACPR to the EBA, while ACPR retains governance, qualifying
      holdings, fit and proper assessments, outsourcing and conflicts of interest. The
      EBA's page introduces that retained list with "such as", so it is not exhaustive and
      should not be restated as closed; the RegWatch edition of 19 October 2026 did
      restate it as closed, which is the error this note exists to stop propagating. The
      second-order consequence falls on firms that do not issue the token. A stablecoin
      whose reserve and redemption supervision sits with an EU-level authority is a
      different credit and liquidity proposition from one supervised by a single national
      regulator, so any token risk assessment or counterparty due diligence file recording
      ACPR as the prudential supervisor is wrong from 12 November. The split itself is the
      operational trap: reserve questions and governance questions now go to different
      authorities, and a firm escalating a redemption concern has to know which door it is
      knocking on. Scored actionability 4 rather than 5 because the obligation is binding
      and dated but the change most firms must make is to documents and escalation routes
      rather than to systems. Reach 4 as a defined set of licence categories holding,
      distributing, redeeming or quoting one token, not a whole sector. Recorded as a
      backfill; see window note.

    required_action: >-
      Before 12 November 2026, correct any token risk assessment, product approval or
      counterparty due diligence file that records ACPR as the prudential supervisor of
      USDC. Record which authority owns which question, and update the escalation route so
      a reserve, liquidity or redemption concern goes to the EBA and a governance, fit and
      proper or outsourcing concern goes to ACPR. Do not treat the retained list as
      exhaustive; the source hedges it.

    status: open
    supersedes: null

  - id: 2026-10-19-eu-002
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: consultation_paper
    title: >-
      EBA consults on draft technical standards for reclassifying investment firms as
      credit institutions, responses due 25 November 2026
    reference: EBA/CP/2026/17
    published: 2026-08-25
    effective: null
    deadline: 2026-11-25
    deadline_type: consultation_close
    source_url: https://www.eba.europa.eu/publications-and-media/events/consultation-regulatory-technical-standards-prudential-requirements-investment-firms
    verified: 2026-11-07

    entity_scope: [investment_firms, credit_institutions]
    functions_affected: [compliance, risk, finance, legal]

    scores:
      actionability: 2
      reach: 3

    rationale: >-
      Draft regulatory technical standards consulted on by the EBA, published 25 August
      2026 and closing 25 November 2026 at 23:59. A naming discrepancy sits on the source
      and is not resolved here: the EBA's consultation page is titled "Consultation on
      Regulatory Technical Standards on prudential requirements for investment firms"
      while the attached consultation paper is titled "Consultation Paper on draft RTS on
      reclassification of investment firms as credit institutions". The RegWatch edition
      of 19 October 2026 carried only the first title, which is why this record carries
      both. Scored actionability 2 under the rubric: a consultation on draft standards
      imposes nothing yet, and the correct response is that planning assumptions move
      rather than that anything changes. Reach 3 as a sub-population defined by a
      threshold, investment firms at or approaching the point where reclassification as a
      credit institution bites, rather than all investment firms. Sits at the edge of the
      RegWatch lane, being prudential rather than financial crime, and is recorded because
      it carries a real date; per the register's convention the band governs treatment, not
      whether an item is kept.

    required_action: >-
      Investment firms near a reclassification threshold should read the draft standards
      and decide whether to respond by 25 November 2026. Firms not responding should still
      record whether reclassification would change their prudential treatment, since the
      planning assumption is the deliverable here rather than any present obligation.

    status: open
    supersedes: null

  - id: 2026-10-19-eu-003
    jurisdiction: EU
    regulator: European Securities and Markets Authority
    regulator_short: ESMA
    instrument_type: technical_standard
    title: >-
      Mandatory electronic, standardised and machine-readable allocations and
      confirmations apply to investment firms and their clients from 7 December 2026
    reference: Amended RTS on Settlement Discipline, OJ:L_202601536; revised CSDR Guidelines on standardised procedures and messaging protocols
    published: 2026-10-16
    effective: 2026-12-07
    deadline: 2026-12-07
    deadline_type: compliance_date
    source_url: https://www.esma.europa.eu/press-news/esma-news/one-year-go-t1-settlement-regulatory-framework-complete-now-lets-make-it
    verified: 2026-11-07

    entity_scope: [investment_firms, credit_institutions]
    functions_affected: [operations, technology, compliance, risk]

    scores:
      actionability: 5
      reach: 4

    rationale: >-
      ESMA's statement of 16 October 2026 confirms that from 7 December 2026 investment
      firms and their clients must use electronic, standardised communication channels,
      international messaging standards and machine-readable communication methods for
      allocations and confirmations, with an exception for temporary technical
      disruptions. The requirements come from the amended RTS on Settlement Discipline
      (OJ:L_202601536); the revised CSDR Guidelines on standardised procedures and
      messaging protocols explain how to meet them. The page does not give the RTS entry
      into force or Official Journal publication date, so neither is asserted. Scored
      actionability 5: a binding obligation with a dated deadline where systems and
      client-facing process must change, which is the clearest case in this file. Reach 4
      as a defined sector, investment firms plus the professional clients and custodians
      in their allocation chain. The second-order consequence is that the burden is not
      only the firm's own messaging but its clients': a firm can be compliant and still
      fail the process if its professional clients cannot send a machine-readable
      allocation, which makes this a client-outreach deadline as much as a technology one.
      This is the dated step toward the EU T+1 go-live of 11 October 2027; ESMA's page
      names no instrument for the go-live date itself, so that date gets no record here.
      `deadline_type` is `compliance_date` rather than `application_date` because the
      obligation is on firms to have completed a change by the date.

    required_action: >-
      Confirm before 7 December 2026 that allocation and confirmation messaging is
      electronic, standardised, machine-readable and uses international messaging
      standards. Separately, identify professional clients who cannot yet meet that
      standard and run the outreach, because their failure surfaces as the firm's
      settlement problem. Document what counts internally as a temporary technical
      disruption, since that is the only exception available.

    status: open
    supersedes: null

  - id: 2026-10-19-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      Two individuals at Nexus advice firms admit defrauding four clients of £2m, with
      sentencing and confiscation proceedings to follow
    reference: Portsmouth Crown Court; Fraud Act 2006 ss1 and 4; Forgery and Counterfeiting Act 1981 s3; Proceeds of Crime Act 2002 s327(1)
    published: 2026-10-13
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/two-plead-guilty-after-clients-lose-2m-fraud-case
    verified: 2026-11-07

    entity_scope: [investment_firms]
    functions_affected: [compliance, legal, operations, board]

    scores:
      actionability: 1
      reach: 2

    rationale: >-
      Kerry Nelson, director of Nexus Independent Financial Advisers Limited and Nexus
      Investment Managers Limited, and Jacqueline Stephens, business operations manager at
      both firms, pleaded guilty at Portsmouth Crown Court on 12 October 2026 to all
      charges brought by the FCA, covering fraud against clients between January 2019 and
      January 2023 and the use of false documents. The offences admitted are fraud by
      abuse of position and using a false instrument; Nelson also admitted converting or
      transferring criminal property over funds withdrawn from the firms. Four clients
      lost £2 million. Sentencing is listed for 10 December 2026 at Portsmouth Crown
      Court, and the FCA will seek confiscation proceedings to deprive Nelson of any
      financial benefit; the release names no confiscation proceedings against Stephens.
      Scored actionability 1 and reach 2 under the rubric: this is a plea announcement
      carrying no published control findings, so the enforcement outcome is confined to
      its facts and the 16 October amendment on generalisable lessons does not apply.
      Recorded for continuity rather than for the calendar. **`deadline` is deliberately
      null.** The 10 December 2026 sentencing is a real date but it is not an obligation on
      any firm, and the taxonomy has no value for a scheduled court date. Forcing it onto
      `compliance_date` or `reporting_date` to get a calendar row would be exactly the
      silent value-bending the handoff rules forbid. If the register wants court dates on
      the calendar, that needs a new `deadline_type`, and that is a decision for Eunice
      rather than a thing to assume here.

    required_action: >-
      No action is required of other firms. Advice firms and networks may wish to revisit
      whether a single director with operational control can move client funds without an
      independent check, which is the structural feature present here, while noting the
      FCA has published no findings and none is attributed to it.

    status: open
    supersedes: null
