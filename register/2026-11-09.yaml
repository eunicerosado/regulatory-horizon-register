# RegWatch register, week ending 2026-11-09
# Converted from the weekly brief. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.

window:
  start: 2026-11-02
  end: 2026-11-09
  coverage: full
  note: >-
    Ten records from the 2 to 9 November 2026 sweep. The two FinCEN announcements of
    6 November are kept as separate records because they carry different instrument
    types and opposite effects: one creates a prohibition by special measure order,
    the other withdraws a proposal that was never in force. The OFAC action of
    5 November is a single record even though the same recent-actions release also
    carried Cuba designations and a Cuba-related determination, because the
    scam-network designations are the substance and the Cuba items are programme
    maintenance. Sources that could not be read during the 9 November sweep, so
    their absence must not be read as silence: Council of the EU press-release
    listing (served a July 2026 cache), Europol newsroom (JavaScript-rendered,
    search returned undated items), OFSI GOV.UK page and OFSI blog (snapshot ending
    23 June 2026), National Crime Agency news (fetch refused), Payment Systems
    Regulator (snapshot ending 3 September 2026), CFPB newsroom (snapshot ending
    14 October 2026), and the Federal Register API and FinCEN agency page (API
    rejected, agency page snapshot ending 6 October 2026). ESMA, AMLA and FATF were
    read successfully and had no items in the window. When this file was committed
    on 2026-11-10 the Federal Register API was read: the notices behind
    2026-11-09-us-001 (FR Doc. 2026-22962) and 2026-11-09-us-002 (FR Doc.
    2026-22809) were read and both records were tightened against them, and the EBA
    final report behind 2026-11-09-eu-001 was read for its application date.

items:
  - id: 2026-11-09-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_final
    title: >-
      10 December 2026: no transmittals from or to MEXC Global
    reference: >-
      Imposition of Special Measure Prohibiting the Transmittal of Funds Involving
      MEXC Global; Federal Register document 2026-22962, 91 FR 72420, published
      10 November 2026; order under section 9714(a) of the Combating Russian Money
      Laundering Act, as amended
    published: 2026-11-06
    effective: 2026-12-10
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/operation-economic-outcast-severs-mexc-globals-access-us-financial-system
    verified: 2026-11-10

    entity_scope: [credit_institutions, payment_service_providers, money_service_businesses, crypto_asset_service_providers]
    functions_affected: [financial_crime, compliance, operations, technology]

    scores:
      actionability: 5
      reach: 5

    rationale: >-
      FinCEN announced on 6 November, under Operation Economic Outcast, an order
      that it says prevents US financial institutions from processing funds
      transfers involving MEXC Global, a convertible virtual currency exchanger FinCEN
      says facilitated at least 16 billion dollars in illicit transactions linked to
      Iranian, North Korean and Russian sanctions evasion and to cybercrime. The
      order itself, read on 2026-11-10, is issued under section 9714(a) of the
      Combating Russian Money Laundering Act (Pub. L. 116-283), as amended by section
      6106(b) of the National Defense Authorization Act for Fiscal Year 2022 (Pub. L.
      117-81), amending 31 CFR Chapter X, Part 1010. It finds MEXC Global, including
      its subsidiaries, branches, offices and successor entities operating outside
      the United States, to be a financial institution of primary money laundering
      concern in connection with Russian illicit finance. Its operative test is that
      a covered financial institution is prohibited from engaging in any transmittal
      of funds from or to MEXC Global, where a covered financial institution has the
      meaning of financial institution in 31 CFR 1010.100(t) and a transmittal of
      funds is the sending and receiving of funds, including CVC. "From or to" is
      narrower than the release's "involving" wording this record was first written
      from. The order is effective 30 days after Federal Register publication on
      10 November 2026, so 10 December 2026. The second-order consequence is a
      control-design one rather than a screening one: an order against a named
      institution does not arrive through a sanctions data feed, so the obligation
      has to be converted by hand into detection logic for the counterparty and its
      aliases and addresses, with an evidenced go-live date before 10 December.
      Actionability 5: a binding obligation with a dated effective date that
      requires a systems change. Reach 5 because the prohibition binds US financial
      institutions generally, and non-US firms inherit it through dollar
      correspondents. instrument_type is rule_final because taxonomy.md has no value
      for a special measure order against a named institution; it is consistent with
      the proposed special measure at 2026-10-06-us-001, recorded as rule_proposed.

    required_action: >-
      Before 10 December 2026, convert the order into a production payment-blocking
      rule for MEXC Global and its known aliases and addresses, record the date it
      went live, and run a retrospective search of payment and counterparty data for
      prior exposure. The test to build to is the order's: a covered financial
      institution, meaning a financial institution as defined in 31 CFR
      1010.100(t), is prohibited from engaging in any transmittal of funds from or
      to MEXC Global, including transfers of CVC.

    status: open
    supersedes: null

  - id: 2026-11-09-us-002
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_withdrawn
    title: >-
      FinCEN and the Federal Reserve withdrew the 2020 proposal to cut the
      cross-border funds transfer recordkeeping and travel rule threshold from
      3,000 to 250 dollars
    reference: >-
      Federal Register document 2026-22809, 91 FR 70824, published 9 November 2026;
      withdrawal of the NPRM at 85 FR 68005 (27 October 2020), RIN 1506-AB41
    published: 2026-11-06
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-announces-withdrawal-proposed-rule-related-recordkeeping-and-travel-rule
    verified: 2026-11-10

    entity_scope: [credit_institutions, money_service_businesses, payment_service_providers, crypto_asset_service_providers]
    functions_affected: [compliance, financial_crime, data, technology]

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      FinCEN announced on 6 November the withdrawal, jointly with the Board of
      Governors of the Federal Reserve System, of a notice of proposed rulemaking that
      would have amended recordkeeping and travel rule requirements for convertible
      virtual currencies and lowered the threshold for funds transfers and
      transmittals of funds that begin or end outside the United States. The Federal
      Register notice, read on 2026-11-10, identifies it as the joint NPRM of
      27 October 2020, which would have reduced the collect-and-retain threshold, and
      FinCEN's transmit threshold, from 3,000 to 250 dollars for cross-border
      transfers, and would have clarified that "money" in the rules covers
      convertible virtual currency and digital assets with legal tender status. The
      withdrawal took effect as of 9 November 2026 and the agencies state they will
      take no further action on the NPRM. Neither the release nor the notice restates
      what remains in force. The existing recordkeeping and travel rule obligations
      are untouched: this removes a proposal, not a duty. Scored 2 on actionability
      because a proposal that is not in force is direction of travel under the
      rubric whatever its news value; the consequence is that planning assumptions
      move, since programmes built around a lower cross-border threshold lose their
      driver and deferred data remediation loses its justification. Reach 4 covers
      banks, money transmitters and virtual asset service providers with cross-border
      flows rather than the whole sector. instrument_type follows taxonomy.md and the
      6 October withdrawals. Continues the thread at 2026-10-12-us-002.

    required_action: >-
      Re-baseline any 2027 change programme that assumed a lower cross-border
      recordkeeping threshold, and re-justify or restart data remediation that was
      deferred pending the proposal. Do not treat the withdrawal as relaxing existing
      recordkeeping or travel rule obligations.

    status: open
    supersedes: null

  - id: 2026-11-09-us-003
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: sanctions_action
    title: >-
      On 5 November 2026, OFAC designated 45 Prince Group-linked targets and one
      cyber target, reaching the corporate infrastructure around scam compounds
    reference: >-
      Designations under Executive Order 13581 as amended and Executive Order 13694
      as further amended; implementation of Executive Order 14390
    published: 2026-11-05
    effective: 2026-11-05
    deadline: null
    deadline_type: null
    source_url: https://home.treasury.gov/news/press-releases/sb0683
    verified: 2026-11-09

    entity_scope: [all_regulated_firms]
    functions_affected: [financial_crime, compliance, onboarding, operations, data]

    scores:
      actionability: 5
      reach: 5

    rationale: >-
      OFAC designated 45 targets under Executive Order 13581 as amended and one
      under Executive Order 13694 as further amended. Forty-five relate to the Prince
      Group transnational criminal organization: four individuals and forty-one
      entities spanning construction, logistics, hotels, insurance, property
      development, gambling, airlines and technology services in Cambodia, Hong Kong,
      the British Virgin Islands, Singapore, Mauritius and Malaysia. The separate
      cyber designation is a Malaysian national based in Madagascar whom Treasury
      says led a scam network. The action builds on designations of 14 October 2025
      and 23 June 2026. The second-order consequence is that this is a beneficial
      ownership exercise in the shape of a sanctions action: with 50 percent rule
      aggregation across multi-jurisdiction holding structures, the blocked
      population is larger than the published list, and the control under test is
      whether screening reaches through the corporate layer. Blocked property must be
      reported to OFAC and civil penalties may apply on a strict liability basis.
      Scored 5 and 5: binding and immediate, reaching all US persons and, through
      dollar exposure, well beyond them. Continues the thread at 2026-09-07-us-001
      and 2026-09-14-us-003, the FinCEN scam-centre alert and the Xinbi Guarantee
      designation.

    required_action: >-
      Ingest the SDN additions, then re-run ownership aggregation across the
      counterparty book rather than relying on name matching alone, and evidence that
      re-run. Report blocked property to OFAC and review exposure in sectors not
      normally treated as sanctions-sensitive, including hospitality, insurance and
      logistics.

    status: open
    supersedes: null

  - id: 2026-11-09-us-004
    jurisdiction: US
    regulator: Federal Trade Commission
    regulator_short: FTC
    instrument_type: enforcement
    title: >-
      On 2 November 2026, the FTC and Washington State settled with a payment
      processor over hidden fees, auto-renewal and cancellation friction
    reference: >-
      FTC and State of Washington v Riverside Payments Inc, Cascade Equipment Leasing
      LLC and two individuals, W.D. Wash.
    published: 2026-11-02
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ftc.gov/news-events/news/press-releases/2026/11/ftc-washington-take-action-against-payment-processor-deceiving-small-businesses-about-costs
    verified: 2026-11-09

    entity_scope: [payment_service_providers]
    functions_affected: [compliance, legal, operations]

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      The FTC and the State of Washington brought an action against a payment
      processor, an affiliated equipment leasing company and two owners over savings
      claims of 40 to 60 percent that were not borne out, omitted activation, batch,
      data-security non-compliance and inactive-processing fees, a 26-page electronic
      contract that did not clearly disclose automatic renewal or a 695 dollar early
      termination fee, promised no-risk cancellation that was difficult to exercise,
      and sales agent earnings claims of 75,000 to 95,000 dollars against an actual
      average of 3,787 dollars. Counts were brought under the FTC Act and the
      Gramm-Leach-Bliley Act, the latter for obtaining consumers' financial
      information through false or fraudulent statements. Defendants pay 600,000
      dollars with a 32,083,921 dollar judgment suspended on inability to pay, and
      must notify customers of a 60-day waiver of the early termination fee. Scored
      actionability 3 under the enforcement guidance in rubric.md: the reasoning
      generalises, because the Gramm-Leach-Bliley pretexting count and the
      negative-option disclosure requirements apply to any business that collects
      billing information behind an auto-renewing contract, so firms outside the
      matter should be able to evidence a position on them. Consistent with the FTC
      payment processor enforcement records at 2026-09-07-us-003 and
      2026-09-14-us-004, both scored 3. Reach 3 as a sub-population defined by
      business model: merchant services and other sellers on auto-renewing
      contracts.

    required_action: >-
      Where the firm sells on auto-renewing contracts, test that all material terms,
      renewal and termination fees are disclosed before billing information is taken,
      that consent to negative-option billing is express, and that a simple
      cancellation route exists and works when tested end to end.

    status: open
    supersedes: null

  - id: 2026-11-09-eu-001
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: guidelines
    title: >-
      On 5 November 2026, the EBA published revised internal governance Guidelines
      under CRD VI, with a lighter duties mapping and a framework for third-country
      branches
    reference: >-
      EBA/GL/2026/10, Guidelines on internal governance under Directive 2013/36/EU,
      issued under Article 74 of that Directive
    published: 2026-11-05
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.eba.europa.eu/publications-and-media/press-releases/eba-publishes-revised-guidelines-internal-governance-delivering-greater-proportionality-and
    verified: 2026-11-10

    entity_scope: [credit_institutions, investment_firms]
    functions_affected: [board, compliance, risk, legal]

    scores:
      actionability: 4
      reach: 5

    rationale: >-
      The revised Guidelines reflect CRD VI, which adds a mapping of duties and
      responsibilities for management body members and key function holders and a
      governance framework for third-country branches. Against the consultation
      draft, the final version reduces the detail required for the duties mapping and
      individual statements, applies more proportionality to third-country branches,
      simplifies conflict-of-interest provisions including where the Chair and an
      executive role are combined, and reduces the granularity of diversity and
      inclusion monitoring. The second-order consequence is that each reduction in a
      required artefact moves the burden of proof from the document to the behaviour:
      the duties mapping exists to turn a collective board responsibility into a
      named one, and reducing its granularity does not reduce the responsibility it
      records. The third-country branch framework is the quieter change, giving a
      measurable standard to branches that previously ran on group governance by
      assertion. The final report, read on 2026-11-10, states that the Guidelines
      apply from two months after publication in all EU official languages and that
      EBA/GL/2021/05 is repealed from a date not yet filled in; the EBA lists them as
      final and awaiting translation, so no application date exists yet and effective
      is left null rather than estimated. Scored actionability 4 as final text with a
      defined application period where only publication of the translations is
      outstanding. Reach 5 as it covers the EU banking sector.

    required_action: >-
      Watch for publication of the translations, which starts the two-month period,
      and record the resulting application date. Re-test the duties mapping and key
      function holder statements against the reduced granularity, and confirm that
      the allocation of duties can be evidenced from how the organisation actually
      operates, not only from the mapping document. Third-country branches should
      gap-assess against the new governance framework.

    status: open
    supersedes: null

  - id: 2026-11-09-eu-002
    jurisdiction: EU
    regulator: European Banking Authority
    regulator_short: EBA
    instrument_type: technical_standard
    title: >-
      On 6 November 2026, the EBA deferred the first supervisory reporting reference
      date to December 2027, with liquidity, encumbrance, benchmarking and ESG to
      December 2028
    reference: >-
      Draft ITS revising Commission Implementing Regulation (EU) 2024/3117 on
      supervisory reporting
    published: 2026-11-06
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.eba.europa.eu/publications-and-media/press-releases/eba-outlines-next-steps-supervisory-reporting-simplification-and-extends-implementation-timelines
    verified: 2026-11-09

    entity_scope: [credit_institutions, investment_firms]
    functions_affected: [finance, risk, data, technology, compliance]

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      Following consultation feedback the EBA set out how it will finalise its
      supervisory reporting simplification, adding further simplification, more
      proportionality and longer implementation timelines. Changes include reduced
      collateral, stress-testing and ESG reporting, integration of credit risk and
      IFRS 9 benchmarking into supervisory reporting, simplified operational risk
      loss reporting, and a dedicated stress-testing reporting module. The first
      reference date for new requirements moves to December 2027, with liquidity,
      asset encumbrance, supervisory benchmarking and ESG reporting deferred to
      December 2028. The final report is due in December 2026 and the technical
      package, covering the data point model, taxonomies and validation rules, in
      early 2027, with institutions given at least a one-year implementation period.
      Scored 2 on actionability because the ITS is draft and not in force, which the
      rubric treats as a 2 regardless of planning significance; reach 5 as it covers
      all institutions subject to EU supervisory reporting. The effective and
      deadline fields are null because the stated dates are month-level only and
      cannot be expressed as a date; they are recorded in this rationale instead.

    required_action: >-
      Move regulatory reporting change plans onto the December 2027 and December 2028
      reference dates, and schedule a read of the December 2026 final report and the
      early-2027 technical package before committing build work. Institutions in the
      benchmarking exercise should keep applying the 2026 benchmarking ITS during the
      transition.

    status: open
    supersedes: null

  - id: 2026-11-09-eu-003
    jurisdiction: EU
    regulator: European Commission
    regulator_short: EC
    instrument_type: supervisory_statement
    title: >-
      On 6 November 2026, the Commission announced an EU Crypto Sanctions Task Force
      to detect circumvention of financial sanctions through crypto assets
    reference: >-
      Statement by Commissioner Albuquerque on the tenth meeting of the High-Level
      Expert Group on Union Restrictive Measures
    published: 2026-11-06
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://finance.ec.europa.eu/news/statement-commissioner-albuquerque-outcomes-tenth-meeting-high-level-meeting-sanctions-2026-11-06_en
    verified: 2026-11-09

    entity_scope: [crypto_asset_service_providers, credit_institutions, payment_service_providers]
    functions_affected: [financial_crime, compliance, risk]

    scores:
      actionability: 2
      reach: 4

    rationale: >-
      The statement reports the tenth meeting of the High-Level Expert Group on Union
      Restrictive Measures, held 5 November with Member State representatives, the
      Commission and the European External Action Service, covering emerging
      financial threats including crypto assets, the role of the European Anti-Fraud
      Office in investigating sanctions circumvention, and Member States' efforts to
      enforce measures consistently. It announces the launch of an EU Crypto
      Sanctions Task Force. It sets no obligations, deadlines or guidance and does not
      describe the task force's mandate, membership or timeline. The second-order
      consequence is directional: pairing OLAF with crypto circumvention signals
      investigative capability being built before any rule, so questions about crypto
      exposure will begin arriving from a part of the system that does not supervise
      the firm and the answers will have to be assembled rather than retrieved. The
      acknowledgement of inconsistent national enforcement matters to any group
      operating across several Member States, because the expectation of uniform
      application is being raised ahead of the capability to enforce it uniformly.
      Scored 2 on actionability as direction of travel with no action required, reach
      4 as it bears on a defined set of licence categories.

    required_action: >-
      Record the task force as a planning assumption for 2027 sanctions work, and
      establish now whether crypto-asset exposure can be evidenced on demand for
      sanctions purposes, including counterparties currently treated as out of scope
      because they are not payment institutions.

    status: open
    supersedes: null

  - id: 2026-11-09-uk-001
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: rule_final
    title: >-
      From 24 June 2027, ESG rating providers may apply for FCA authorisation, with
      the UK regime taking effect 29 June 2028
    reference: PS26/22, ESG ratings, final regime
    published: 2026-11-03
    effective: 2028-06-29
    deadline: 2027-06-24
    deadline_type: submission_due
    source_url: https://www.fca.org.uk/news/press-releases/new-fca-rules-bring-esg-rating-providers-uk-regulation-first-time
    verified: 2026-11-09

    entity_scope: [all_regulated_firms]
    functions_affected: [compliance, board, legal, risk, data]

    scores:
      actionability: 4
      reach: 3

    rationale: >-
      The FCA published its final regime bringing ESG rating providers into UK
      regulation for the first time, covering transparency, governance, systems and
      controls, management of conflicts of interest, and engagement with users of
      ratings and with rated entities. It regulates how ratings are produced,
      governed and communicated and does not prescribe a methodology. It follows
      CP25/34, open 1 December 2025 to 31 March 2026, and the October 2025
      legislation that brought ESG ratings within the FCA's remit. Providers must
      begin applying from 24 June 2027 in staggered periods, and from 29 June 2028
      providing ESG ratings in the UK requires authorisation and the relevant
      permission unless an exemption applies; the FCA has published scoping guidance.
      The second-order consequence sits with who has to build a compliance function
      from nothing: many providers are data, research, index and analytics businesses
      with no conflicts register, no systems and controls documentation and no
      authorisation experience, and the binding constraint is the governance evidence
      that only accrues through a year of operation. For consumers of ratings the
      effect lands earlier, in 2027 vendor review, if a provider does not intend to
      apply. Scored actionability 4 as binding with a long implementation window,
      reach 3 as a defined business model rather than a licensed sector.
      deadline_type is submission_due, the taxonomy value for an authorisation
      gateway application, as at 2026-10-06-uk-001; note that 24 June 2027 is the
      date the application window opens, not a filing deadline, because the release
      does not give the closing dates of the staggered periods. entity_scope is
      recorded as all_regulated_firms because the taxonomy has no value for a newly
      regulated non-financial provider; the population is narrower than that label.

    required_action: >-
      Providers: reach and document a scoping conclusion against the FCA's guidance,
      naming the decision maker and recording exclusions, then begin generating the
      governance and conflicts evidence an application will require, and plan for a
      staggered slot that may fall well before June 2028. Users of ESG ratings: add
      authorisation intent to 2027 vendor due diligence.

    status: open
    supersedes: null

  - id: 2026-11-09-uk-002
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: supervisory_statement
    title: >-
      On 3 November 2026, the FCA set conditions on motor finance settlement offers
      made while the redress scheme is partially suspended
    reference: FCA expectations for firms making car finance settlement offers
    published: 2026-11-03
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/fca-sets-expectations-firms-making-car-finance-settlement-offers
    verified: 2026-11-09

    entity_scope: [all_regulated_firms]
    functions_affected: [compliance, operations, risk, legal]

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      With the motor finance redress scheme partially suspended while legal
      challenges are heard between 16 February and 3 March 2027, the FCA set out
      expectations for lenders choosing to make settlement offers: customers must be
      offered no less than they would receive through the scheme; lenders must explain
      that accepting means keeping the money even if the legal outcome would have paid
      less and that no further claim can be made if it would have paid more; the
      FCA's factsheet must be shared; lenders must notify the FCA of an intention to
      make offers and the FCA will publish a list of those doing so; and offers
      cannot be referred to the Financial Ombudsman Service because a customer may
      reject an offer and leave the claim to the scheme. Barclays Partner Finance has
      confirmed it will make offers to some customers. Firms must continue preparing
      for the scheme and progressing complaints but need not calculate or pay
      compensation until the legal process concludes. The second-order consequence is
      that "no less than the scheme would pay" is a calculation obligation inside a
      settlement condition: a compliant offer requires a scheme-equivalent
      calculation, with versioned assumptions and a record of which version applied
      to which customer, before the methodology is finally settled. Scored
      actionability 3 as a supervisory expectation firms must evidence a position
      against, reach 4 as a defined sector. entity_scope is recorded as
      all_regulated_firms because the taxonomy has no value for motor finance
      lenders; the population is narrower than that label. board is not listed in
      functions_affected because the FCA does not require a governing-body decision;
      taking the decision at board level is this register's recommendation, not an
      obligation.

    required_action: >-
      Lenders intending to make offers: notify the FCA, share the factsheet, and put
      in place a versioned scheme-equivalence calculation with a per-customer record
      of the assumptions applied, so consistency across the book can be demonstrated
      once the methodology is settled. Take the decision to offer at board level
      given the published list.

    status: open
    supersedes: null

  - id: 2026-11-09-uk-003
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: report
    title: >-
      By 31 December 2026, firms must register interest to join the FCA's Quantum
      Experimentation Group on money laundering and fraud detection
    reference: FCA Quantum Experimentation Group
    published: 2026-11-05
    effective: null
    deadline: 2026-12-31
    deadline_type: consultation_close
    source_url: https://www.fca.org.uk/news/press-releases/fca-explore-quantum-computing-tackle-financial-crime
    verified: 2026-11-09

    entity_scope: [all_regulated_firms]
    functions_affected: [financial_crime, technology, data]

    scores:
      actionability: 2
      reach: 2

    rationale: >-
      The FCA announced the Quantum Experimentation Group, which it describes as the
      first regulator-led group of its kind, to test initially whether quantum
      machine learning can help detect money laundering and fraud. The FCA will
      provide a synthetic dataset to address the difficulty firms have in obtaining
      suitable test data, and participants may include financial services firms,
      quantum technology providers and national research laboratories at varying
      stages of maturity. Interest must be registered by 31 December 2026 and the
      group launches in Q1 2027. The release sets no new obligations. Scored 2 and 2:
      voluntary participation in a narrow activity. The record exists because the
      31 December date is real and belongs on the calendar, and because the synthetic
      dataset, if its labelling is published, is the more reusable output than any
      quantum result; the register's convention is that the band governs treatment,
      not whether an item is kept. deadline_type is consultation_close, following
      2026-11-02-eu-001 and 2026-10-06-eu-003 for a voluntary call for expressions of
      interest: submission_due is reserved for one-off filings whose miss costs the
      right to carry on an activity.

