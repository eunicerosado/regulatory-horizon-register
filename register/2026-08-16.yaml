window:
  start: 2026-08-10
  end: 2026-08-16
  coverage: partial
  note: >-
    Backfilled single record. Not a swept week — do not read the absence of
    other items here as an absence of developments.

items:

  - id: 2026-08-16-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_final
    title: >-
      On 11 August 2026, FinCEN ended BOI reporting for US firms
    reference: >-
      Federal Register document 2026-16576, 91 FR 52508, Beneficial Ownership
      Information Reporting Requirement Revision, published 14 August 2026
    published: 2026-08-11
    effective: 2026-08-14
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-permanently-ends-beneficial-ownership-reporting-requirements-millions
    verified: 2026-11-19

    entity_scope:
      - all_regulated_firms
      - credit_institutions
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - onboarding
      - compliance
      - data

    scores:
      actionability: 5
      reach: 5

    rationale: >-
      FinCEN issued a final rule that permanently removes the requirement for US
      companies and US persons to report beneficial ownership information under the
      Corporate Transparency Act, effective on publication in the Federal Register.
      The Federal Register notice, read on 2026-11-19, gives publication and effect as
      14 August 2026 and states that the rule adopts as final, with certain limited
      changes, the interim final rule issued on 26 March 2025; it also exempts
      reporting companies from submitting information about US person company
      applicants, and exempts US persons from updating information provided to obtain
      a FinCEN identifier. Foreign entities that are reporting companies must still
      report beneficial ownership information for foreign individuals. FinCEN also
      announced that it will delete previously reported information of US persons from
      the beneficial ownership information database. The second point is the one that
      reaches beyond US filers: an ownership data source that firms may have expected
      to corroborate against is being removed, not merely frozen, so verification of
      US entity ownership reverts entirely to firm-collected evidence. Verification on
      2026-11-19 removed two claims that neither the release nor the notice supports:
      that the rule narrows "reporting company" to entities formed under foreign law
      and registered to do business in a US State or Tribal jurisdiction, and that New
      York's LLC Transparency Act narrowed alongside.

    required_action: >-
      Review CDD and onboarding policy wherever it references BOI filings or the
      FinCEN database as an ownership evidence source, and confirm what replaces
      it for US-formed entities. Applies to any firm onboarding US entities,
      not only US-regulated firms.

    status: open
    supersedes: null
