# RegWatch register, week ending 2026-11-16
# Converted from the weekly brief. Facts trace to the linked primary source.
# `verified` records the date the primary source was last re-checked.

window:
  start: 2026-11-10
  end: 2026-11-16
  coverage: full
  note: >-
    Window opens the day after the 2026-11-09 window closed. Nine records: five US, four
    UK, none for the EU. The pack for this week carried a tenth record on the 12 November
    start of EBA and ACPR dual supervision over USDC; it was not committed because that
    event is already recorded at 2026-10-19-eu-001, with 12 November as its deadline, and
    commencing on schedule is not a material move under rubric.md. Sources that could not
    be read, so their absence is not silence: FATF (every page returned a client error,
    including a report on illicit financial flows linked to scam compounds whose date
    could not be read, so it is deliberately not recorded); Council of the EU press
    releases (cached listing showing 28 September to 2 October 2026); Europol newsroom
    (JavaScript, fourth consecutive edition); CFPB newsroom (snapshot to 14 October 2026);
    Payment Systems Regulator (listing readable but stale, most recent item 3 September
    2026); the FCA publications search (robots-disallowed, so FCA consultation papers and
    policy statements in the window could not be listed); DOJ listing (visible items dated
    12 and 13 November only, so 10, 11 and 14 to 16 November are unchecked); HM Treasury,
    Companies House, OCC, Federal Reserve and FDIC (searched, not fetched). The 14th and
    15th were a weekend and nothing dated 16 November had appeared on any page read. When
    this file was committed on 2026-11-19 the OFSI factsheet behind 2026-11-16-uk-003 was
    read and that record tightened; the ICO page behind 2026-11-16-uk-002 returned a bot
    check and was not re-read.

items:
  - id: 2026-11-16-us-001
    jurisdiction: US
    regulator: United States Department of Justice
    regulator_short: DOJ
    instrument_type: enforcement
    title: >-
      On 12 November DOJ moved to seize $1.2bn of DPRK crypto
    reference: Justice Department press release No. 26-1356
    published: 2026-11-12
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.justice.gov/opa/pr/justice-department-announces-actions-disrupt-north-koreas-massive-theft-cryptocurrency
    verified: 2026-11-16

    entity_scope: [crypto_asset_service_providers, credit_institutions, payment_service_providers]
    functions_affected: [financial_crime, compliance, technology, operations]

    scores:
      actionability: 3
      reach: 4

    rationale: >-
      The Department obtained court authorisation to seize or restrain more than 1.2
      billion dollars of assets stolen from Binance on or about 29 October, a theft
      the FBI attributes to the North Korean group it calls TraderTraitor and which
      the release puts at more than 6 billion dollars; collective government and
      private sector efforts have frozen more than 2.7 billion. The same release
      covers seizure of infrastructure behind a social engineering scheme the FBI
      calls FaceStealer, more than 400 million dollars over 18 months. The
      second-order point is the recovery ratio itself, which is now a public figure a
      firm can use when sizing a control, and the laundering route the release names,
      bridges, mixers and exchanges, which puts the recoverable window in hours.
      Actionability is 3 and not 1 because the reasoning generalises: the blocking
      expectation reached firms through a cyber alert to virtual asset service
      providers rather than through a list update, which is a routing problem most
      control environments have not solved. Reach is 4 rather than 5 because the
      obligation lands on virtual asset service providers and their banks rather than
      across every sector. Continues the thread at 2026-11-02-us-002, the OFAC
      designations of a DPRK IT worker network whose listings carried digital currency
      addresses.

    required_action: >-
      Confirm who in the firm receives law enforcement cyber alerts and how an address-level
      blocking expectation in one reaches the screening or wallet-screening engine, with a
      recorded time from receipt to live control. Record the recovery ratio for this event in
      the crypto theft risk assessment rather than a vendor detection claim.

    status: open
    supersedes: null

  - id: 2026-11-16-us-002
    jurisdiction: US
    regulator: Office of Foreign Assets Control
    regulator_short: OFAC
    instrument_type: sanctions_action
    title: >-
      On 13 November OFAC hit two Guatemalan trafficking groups
    reference: Treasury press release sb0689; OFAC recent actions 20261113
    published: 2026-11-13
    effective: 2026-11-13
    deadline: null
    deadline_type: null
    source_url: https://home.treasury.gov/news/press-releases/sb0689/
    verified: 2026-11-16

    entity_scope: [all_regulated_firms, credit_institutions, money_service_businesses]
    functions_affected: [financial_crime, compliance, onboarding, legal]

    scores:
      actionability: 4
      reach: 4

    rationale: >-
      Los Mendoza DTO was designated under Executive Order 14059 and under Executive
      Order 13224 as amended by Executive Order 13886 for material support to the
      Sinaloa Cartel; Los Huistas DTO was designated under Executive Order 13224 as
      amended for material support to the Sinaloa Cartel and CJNG, having been
      designated under Executive Order 14059 on 18 March 2022. Concurrently the State
      Department designated Los Lorenzanas as a Foreign Terrorist Organization under
      section 219 of the Immigration and Nationality Act and as an SDGT. The
      counter-terrorism authority is what changes the risk: exposure moves from a
      civil blocking question to material support, and Treasury states that
      significant transactions by foreign financial institutions risk restrictions on
      US correspondent or payable-through accounts. Actionability is 4 rather than 5
      because the obligation is immediate but contained to screening and relationship
      review with no dated implementation step. Reach is 4 rather than 5 because the
      live counterparty exposure is concentrated in the Guatemala, Honduras, Belize
      and Mexico corridors, even though the blocking duty itself binds every US
      person. Continues the thread at 2026-08-23-us-002, whose 20 August action
      designated an Ecuador-based trafficking network under Executive Order 14059 with
      several members also under Executive Order 13224.

    required_action: >-
      Re-run screening and 50 percent rule ownership aggregation across the book for the newly
      designated organisations, and separately review commercial counterparties in the named
      corridors for material support exposure under the counter-terrorism authority, which the
      standard sanctions file is not written to answer.

    status: open
    supersedes: null

  - id: 2026-11-16-us-003
    jurisdiction: US
    regulator: United States Department of Justice
    regulator_short: DOJ
    instrument_type: enforcement
    title: >-
      On 13 November Johnson Controls paid $5m over cyber terms
    reference: >-
      False Claims Act settlement; United States ex rel. Vance v. Johnson Controls, Inc.,
      No. 1:24-cv-2500 (N.D. Ga.); United States ex rel. Thomas v. Johnson Controls Int'l PLC,
      No. 1:26-cv-448 (D.D.C.)
    published: 2026-11-13
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.justice.gov/opa/pr/hvac-supplier-johnson-controls-inc-and-two-subsidiaries-agree-pay-5-million-settle
    verified: 2026-11-16

    entity_scope: [all_regulated_firms]
    functions_affected: [risk, compliance, technology, legal]

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      Johnson Controls, Inc. and two subsidiaries agreed to pay 5 million dollars to resolve
      allegations that from January 2018 to August 2025 they failed to comply with
      cybersecurity requirements in federal contracts, including failing to control access to
      protected information, failing to maintain a System Security Plan meeting contract
      requirements where NIST SP 800-171 applied, and failing to adequately document, develop
      or implement a plan of action and milestones. Two whistleblower suits were resolved and
      one relator receives 850,000 dollars; the claims are allegations only with no
      determination of liability. The transferable lesson is the attestation surface: a
      contractual security representation converts an ordinary control gap into a payment
      claim, and the same structure sits under supplier self-attestations and certifications
      in third-party risk programmes. Actionability is 3 on the generalisable-enforcement
      reading of the rubric. Reach is 3 because the directly affected population is
      contractors subject to NIST SP 800-171 rather than a whole sector, even though the
      reasoning reaches any firm that signs or relies on a security attestation.
      `entity_scope: all_regulated_firms` is the least-wrong value; the real population is
      government contractors and outsourced service providers.

    required_action: >-
      Identify every contractual security or resilience representation the firm has signed,
      name an owner for each, and test whether that owner could evidence the statement under
      challenge today rather than at the next renewal.

    status: open
    supersedes: null

  - id: 2026-11-16-us-004
    jurisdiction: US
    regulator: Federal Bureau of Investigation, Internet Crime Complaint Center
    regulator_short: DOJ
    instrument_type: advisory
    title: >-
      On 13 November the FBI warned on AI-run intrusion tooling
    reference: FBI FLASH FLASH-20261113-001, Threat Overview of ARTEX Autonomous Penetration Testing Framework
    published: 2026-11-13
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.ic3.gov/CSA/2026/261113.pdf
    verified: 2026-11-16

    entity_scope: [all_regulated_firms]
    functions_affected: [technology, risk, operations]

    scores:
      actionability: 2
      reach: 5

    rationale: >-
      The FLASH describes ARTEX, an open-source framework using large language models
      for autonomous penetration testing, adapted by malicious actors to automate
      intrusion from reconnaissance through data theft, with some intrusions
      reportedly reaching privileged access in under three hours. The original
      repository was removed in October 2026 but forks, mirrors and a commercial
      variant persist, and researchers counted more than 1,600 publicly exposed
      consoles in early November 2026. Financial services is first on the list of
      targeted sectors. The mitigations are conventional: inventory internet-facing
      applications, restrict management interfaces, least privilege on multi-tenant
      permissions, monitor privileged role changes, rate-limit high-impact APIs, alert
      on bulk record access, and preserve sign-in and audit evidence before
      irreversible changes. The consequence that is not conventional is governance:
      incident response and notification plans assume a human attacker's
      reconnaissance period, and known gaps carried on a remediation plan were priced
      against that assumption. Actionability is 2 because no obligation attaches and
      the proper response is a change in planning assumptions. Reach is 5 because ten
      sectors are named. board is not listed in functions_affected because the FLASH
      requires no governing-body decision, attestation or documented oversight;
      re-presenting an accepted gap is this register's recommendation, not an
      obligation.

    required_action: >-
      Re-test the timing assumptions in the incident response plan, escalation matrix and
      third-party notification clauses against an intrusion reaching privileged access in
      hours, and re-present any accepted gap whose risk acceptance relied on a longer
      detection window.

    status: open
    supersedes: null

  - id: 2026-11-16-us-005
    jurisdiction: US
    regulator: Securities and Exchange Commission
    regulator_short: SEC
    instrument_type: report
    title: >-
      On 10 November the SEC reported 348 enforcement actions
    reference: SEC press release 2026-113, Enforcement Annual Results for Fiscal Year 2026
    published: 2026-11-10
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.sec.gov/newsroom/press-releases/2026-113-sec-announces-enforcement-annual-results-fiscal-year-2026
    verified: 2026-11-16

    entity_scope: [investment_firms, fund_managers]
    functions_affected: [compliance, legal, risk]

    scores:
      actionability: 1
      reach: 4

    rationale: >-
      Fiscal year 2026 results: 348 enforcement actions, 235 standalone and 113 follow-on
      administrative proceedings, 13 trading suspensions, 1.095 billion dollars ordered of
      which 752 million was disgorgement and prejudgment interest and 343 million civil
      penalties, with 235 million of the disgorgement deemed satisfied in a separate action
      and about 731 million returned to more than 250,000 investors. About 26,000 whistleblower
      tips, more than 158 million awarded to 65 individuals, the most recipients since fiscal
      2023. Two thirds of standalone actions charged at least one individual. Priorities named
      are fraud, market manipulation, insider trading, gatekeeper failures, retail fraud
      through a new working group, and cross-border fraud through a task force. Actionability
      is 1 because this is a statistics release restating existing obligations; the planning
      value is in the individual accountability ratio and the cross-border focus rather than
      in any required change.

    required_action: >-
      Use the individual accountability ratio as the framing for the next board or audit
      committee read of surveillance effectiveness: which detective controls would have caught
      the case types nearest the firm's own business model.

    status: open
    supersedes: null

  - id: 2026-11-16-uk-001
    jurisdiction: UK
    regulator: National Crime Agency
    regulator_short: NCA
    instrument_type: enforcement
    title: >-
      On 13 November the NCA settled two UWOs worth GBP 55m
    reference: Unexplained Wealth Order settlements approved by the High Court on 12 November 2026
    published: 2026-11-13
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.nationalcrimeagency.gov.uk/news/two-more-suspected-international-money-launderers-lose-55m-to-the-nca
    verified: 2026-11-16

    entity_scope: [credit_institutions, designated_non_financial_businesses]
    functions_affected: [financial_crime, onboarding, compliance, legal]

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      Two Unexplained Wealth Order cases, both linked to one of Singapore's largest money
      laundering cases, settled rather than litigated, with the High Court approving on 12
      November. The first surrenders 75 percent of assets worth 35,187,285 pounds, from an
      earlier freeze of about 45 million pounds in April and July 2025 over alleged proceeds
      of illegal gambling and overseas scam centres, including two London properties,
      2,607,700 pounds of rental income and 300,000 pounds in a bank account. In the second,
      16 newbuild flats in a Soho development were bought for 24.7 million pounds in 2023
      without mortgages through two UK companies incorporated for the purpose with one
      ultimate beneficial owner, and after an unanswered UWO in June 2026 the NCA will recover
      19,771,175 pounds. The NCA says it has seized about 75 million pounds from the same
      group in 12 months. The generalisable lesson sits with the gatekeepers the structure
      passed through, company formation, conveyancing, letting and the accounts that moved the
      funds, and the pattern is not subtle. The second-order consequence is that settlement
      leaves the evidential standard for this kind of wealth untested in open court, so firms
      calibrate source-of-wealth standards from settlements rather than from judgments.

    required_action: >-
      Run a lookback for the pattern rather than the names: multiple unmortgaged residential
      purchases in one development, through companies incorporated shortly before completion,
      with a single beneficial owner and rental income routed back to the same party.

    status: open
    supersedes: null

  - id: 2026-11-16-uk-002
    jurisdiction: UK
    regulator: Information Commissioner's Office
    regulator_short: ICO
    instrument_type: supervisory_statement
    title: >-
      On 12 November the ICO wrote to 200 health sector leaders
    reference: ICO warning to the UK health sector on unauthorised access to medical records
    published: 2026-11-12
    effective: 2027-02-12
    deadline: 2027-02-12
    deadline_type: compliance_date
    source_url: https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/11/uk-health-sector-warned-to-tackle-medical-record-snooping/
    verified: 2026-11-16

    entity_scope: [all_regulated_firms]
    functions_affected: [compliance, data, risk, board]

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      The ICO reports over 300 reports of unauthorised access from health organisations between
      1 January and mid-October 2026, including staff viewing records without a legitimate need
      and sharing information with others, and has written to more than 200 senior health
      leaders asking them to personally confirm that access is granted, reviewed and removed
      appropriately, that suspicious access is spotted through effective monitoring and audit,
      that staff understand the consequences, and that the organisation acts promptly when
      something goes wrong. Leaders should confirm they have reviewed their approach within the
      past six months; those who have not must complete a review within the next three months.
      The ICO can prosecute individuals under section 170 of the Data Protection Act 2018 and
      has prosecuted 16 healthcare staff in a decade, which is why the pressure is being
      applied to leadership instead. The second-order consequence is evidential: once an
      executive has personally confirmed that monitoring is effective, the next incident is a
      question about that confirmation. Dates: the three-month instruction is on the page and
      the publication date is 12 November 2026, so 12 February 2027 is arithmetic rather than
      a date the ICO printed; `effective` and `deadline` are set to the same date per the
      forward-dated obligation convention. `entity_scope: all_regulated_firms` is the
      least-wrong value; the addressed population is UK health organisations, and the reasoning
      reaches any organisation holding sensitive records. `board` is used because the
      confirmation is asked of named senior leaders.

    required_action: >-
      Confirm whether a review of records-access controls has been completed in the past six
      months; if not, schedule and complete one within three months of 12 November 2026, and
      retain evidence that access-monitoring output was read and escalated, not merely
      generated.

    status: open
    supersedes: null

  - id: 2026-11-16-uk-003
    jurisdiction: UK
    regulator: Office of Financial Sanctions Implementation
    regulator_short: OFSI
    instrument_type: guidelines
    title: >-
      On 12 November OFSI added an overseas business factsheet
    reference: Sanctions Factsheet for Overseas Business, added to the UK financial sanctions guidance collection
    published: 2026-11-12
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.gov.uk/guidance/uk-financial-sanctions-guidance
    verified: 2026-11-19

    entity_scope: [all_regulated_firms]
    functions_affected: [financial_crime, compliance, legal]

    scores:
      actionability: 1
      reach: 3

    rationale: >-
      The UK financial sanctions guidance page's change log records one entry for 12
      November 2026, "Added Sanctions Factsheet for Overseas Business", listed under
      general guidance. The factsheet, read on 2026-11-19, is headed "What are UK
      financial sanctions?" and carries no date. It restates existing obligations for
      UK persons and firms operating overseas: UK persons and companies are covered
      wherever they are, UK firms with overseas operations remain subject to UK
      obligations, and UK sanctions generally extend to the Crown Dependencies and
      Overseas Territories subject to each one's legislation; asset freezes cover
      entities a designated person owns or controls, so stakeholders and beneficial
      owners should be screened and not only the named party; UK, EU and US regimes
      are separate and compliance with one is not compliance with another; due
      diligence is not a one-time exercise; OFSI may license otherwise prohibited
      activity; and civil penalties apply on a strict liability basis, with criminal
      prosecution carrying up to seven years' imprisonment. Actionability is 1 because
      the factsheet is a restatement of existing obligations, which rubric.md scores
      1; the pack scored it 2. Reach is 3, a sub-population of UK persons and firms
      with overseas operations. The record exists because a dated OFSI guidance
      addition belongs on the timeline and because an absence here would read as OFSI
      having published nothing in the window.

    required_action: >-
      Route the factsheet to whoever owns sanctions policy for overseas subsidiaries
      and branches, and check it against the group policy's statement of when UK
      sanctions apply; the addition changes no obligation.

    status: open
    supersedes: null

  - id: 2026-11-16-uk-004
    jurisdiction: UK
    regulator: Financial Conduct Authority
    regulator_short: FCA
    instrument_type: enforcement
    title: >-
      On 10 November a fake GBP 154m takeover bid drew a sentence
    reference: Sentencing at Southwark Crown Court, 10 November 2026; guilty pleas entered 10 September 2026
    published: 2026-11-10
    effective: null
    deadline: null
    deadline_type: null
    source_url: https://www.fca.org.uk/news/press-releases/man-sentenced-over-154m-fake-takeover-bid-targeting-uk-listed-company
    verified: 2026-11-16

    entity_scope: [investment_firms]
    functions_affected: [compliance, financial_crime, operations]

    scores:
      actionability: 3
      reach: 3

    rationale: >-
      A defendant was sentenced to two years suspended for two years, with 200 hours of unpaid
      work and 4,627.73 pounds of costs, plus three concurrent 14-month custodial sentences for
      forgery, after pleading guilty to fraud by false representation and three counts of
      making a false instrument. He had built a stake in an AIM and Toronto-listed oil and gas
      company, then launched a bogus bid using invented identities, forged takeover documents
      and a meeting with the chief executive under a false name, standing to gain up to about
      70,000 pounds. The transferable point is detection rather than conduct: the FCA says
      investigators combined transaction reporting data, phone records, receipts, CCTV and
      seized evidence, linking three phone numbers to a single handset and using FCA trading
      data to narrow suspects. Actionability is 3 on the generalisable-enforcement reading,
      because transaction reporting data quality is what made the case assemblable. Reach is 3,
      a sub-population of listed issuers, brokers and market surveillance functions.

    required_action: >-
      Treat this as a transaction reporting data quality argument for the next funding
      conversation: the evidential chain depended on reported data being complete enough to
      narrow a suspect set.

    status: open
    supersedes: null
