items:

  - id: 2026-08-16-us-001
    jurisdiction: US
    regulator: Financial Crimes Enforcement Network
    regulator_short: FinCEN
    instrument_type: rule_final
    title: >-
      FinCEN final rule permanently removes beneficial ownership reporting for
      US companies and US persons under the Corporate Transparency Act
    reference: null
    published: 2026-08-11
    effective: 2026-08-14
    deadline: null
    deadline_type: null
    source_url: https://www.fincen.gov/news/news-releases/fincen-permanently-ends-beneficial-ownership-reporting-requirements-millions
    verified: 2026-08-24

    entity_scope:
      - all_regulated_firms
      - credit_institutions
      - designated_non_financial_businesses
    functions_affected:
      - financial_crime
      - onboarding
      - compliance
      - data

    scores:
      actionability: 5
      reach: 5

    rationale: >-
      The final rule makes permanent the exemptions first introduced by the
      March 2025 interim final rule, narrowing "reporting company" to entities
      formed under foreign law and registered to do business in a US State or
      Tribal jurisdiction. US companies and US persons no longer report BOI;
      foreign reporting companies still report BOI for foreign individuals.
      FinCEN also announced it will delete BOI previously reported by US persons
      from the database. The second point is the one that reaches beyond US
      filers: an ownership data source that firms may have expected to
      corroborate against is being removed, not merely frozen. Verification of
      US entity ownership reverts entirely to firm-collected evidence. Note also
      that New York's LLC Transparency Act defines its terms by reference to the
      federal regime, so its scope narrowed alongside.

    required_action: >-
      Review CDD and onboarding policy wherever it references BOI filings or the
      FinCEN database as an ownership evidence source, and confirm what replaces
      it for US-formed entities. Applies to any firm onboarding US entities,
      not only US-regulated firms.

    status: open
    supersedes: null
